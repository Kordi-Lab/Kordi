name: AccessibilityReproduction
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  ReproductionApp:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.KordiAccessibilityRepro
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  ReproductionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ReproductionApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.KordiAccessibilityRepro.tests
schemes:
  Reproduction:
    build:
      targets:
        ReproductionApp: all
    test:
      targets: [ReproductionUITests]
