<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kordi iOS camera photo send review</title>
  <style>
    /* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4 */
    /* Hallmark · genre: modern-minimal · macrostructure: Workbench · theme: existing Kordi iOS
     * audience: Kordi iOS chat users · use: review, edit, caption, and send a captured photo
     * contrast: pass (40–41) · chrome: pass (47) · tokens: pass (48)
     * responsive: pass (34, 49–57)
     */
    :root {
      color-scheme: dark;
      --color-canvas: #000000;
      --color-surface: #111214;
      --color-surface-raised: #202124;
      --color-surface-active: #263d68;
      --color-rule: #34363a;
      --color-text: #f7f7f8;
      --color-muted: #a9abb0;
      --color-accent: #2563eb;
      --color-accent-ink: #ffffff;
      --color-focus: #8bb4ff;
      --color-overlay: rgba(0, 0, 0, 0.58);
      --color-crop: rgba(255, 255, 255, 0.72);
      --color-draw: #ff453a;
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      --space-2xs: 0.25rem;
      --space-xs: 0.5rem;
      --space-sm: 0.75rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --control-height: 2.75rem;
      --radius-control: 0.875rem;
      --radius-round: 999px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --duration-short: 180ms;
      --shadow-send: 0 0.5rem 1.4rem rgba(37, 99, 235, 0.34);
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
      overflow-x: clip;
      background: var(--color-canvas);
      color: var(--color-text);
      font-family: var(--font-body);
    }

    button,
    input { font: inherit; }

    button {
      color: inherit;
      white-space: nowrap;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }

    .editor {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: min(100%, 27rem);
      min-height: 100dvh;
      margin-inline: auto;
      background: var(--color-canvas);
    }

    .editor__header {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      min-height: 3.5rem;
      padding-inline: max(var(--space-sm), env(safe-area-inset-left));
      padding-block-start: env(safe-area-inset-top);
      background: var(--color-overlay);
      backdrop-filter: blur(1rem);
    }

    .editor__title {
      min-width: 0;
      margin: 0;
      font-family: var(--font-display);
      font-size: 1rem;
      font-style: normal;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .header-button {
      min-width: 2.75rem;
      min-height: 2.75rem;
      border: 0;
      border-radius: var(--radius-control);
      background: transparent;
      color: var(--color-text);
      cursor: pointer;
    }

    .header-button:first-child { justify-self: start; }
    .header-button:last-child { justify-self: end; }

    .photo-stage {
      position: relative;
      display: grid;
      min-height: 0;
      overflow: hidden;
      background: var(--color-canvas);
    }

    .photo-stage__image {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: contain;
      transition: transform var(--duration-short) var(--ease-out);
    }

    .photo-stage[data-rotation="90"] .photo-stage__image { transform: rotate(90deg) scale(0.76); }
    .photo-stage[data-rotation="180"] .photo-stage__image { transform: rotate(180deg); }
    .photo-stage[data-rotation="270"] .photo-stage__image { transform: rotate(270deg) scale(0.76); }

    .crop-guide {
      position: absolute;
      inset: 8% 7%;
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--duration-short) var(--ease-out);
    }

    .crop-guide {
      border: 1px solid var(--color-crop);
      background-image:
        linear-gradient(to right, transparent 33%, var(--color-crop) 33%, var(--color-crop) calc(33% + 1px), transparent calc(33% + 1px), transparent 66%, var(--color-crop) 66%, var(--color-crop) calc(66% + 1px), transparent calc(66% + 1px)),
        linear-gradient(to bottom, transparent 33%, var(--color-crop) 33%, var(--color-crop) calc(33% + 1px), transparent calc(33% + 1px), transparent 66%, var(--color-crop) 66%, var(--color-crop) calc(66% + 1px), transparent calc(66% + 1px));
    }

    .draw-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      touch-action: none;
    }

    .photo-stage[data-tool="crop"] .crop-guide { opacity: 1; }
    .photo-stage[data-tool="draw"] .draw-canvas {
      pointer-events: auto;
      cursor: crosshair;
    }

    .editor__controls {
      position: relative;
      z-index: 2;
      padding: var(--space-xs) max(var(--space-sm), env(safe-area-inset-right)) max(var(--space-sm), env(safe-area-inset-bottom));
      background: var(--color-overlay);
      backdrop-filter: blur(1rem);
    }

    .tool-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-xs);
      margin-block-end: var(--space-xs);
    }

    .tool-button {
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: var(--control-height);
      border: 0;
      border-radius: var(--radius-control);
      background: transparent;
      color: var(--color-muted);
      cursor: pointer;
    }

    .tool-button svg {
      width: 1.4rem;
      height: 1.4rem;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .tool-button:hover { background: var(--color-surface-raised); }
    .tool-button:active { transform: translateY(1px); }
    .tool-button[aria-pressed="true"] {
      background: var(--color-surface-active);
      color: var(--color-text);
    }

    .send-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: var(--space-xs);
      align-items: center;
    }

    .caption {
      width: 100%;
      height: var(--control-height);
      min-width: 0;
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-round);
      outline: 2px solid transparent;
      padding-inline: var(--space-md);
      background: var(--color-surface);
      color: var(--color-text);
    }

    .caption::placeholder { color: var(--color-muted); }
    .caption:hover { background: var(--color-surface-raised); }
    .caption:focus { border-color: var(--color-accent); }

    .send-button {
      display: grid;
      place-items: center;
      width: var(--control-height);
      height: var(--control-height);
      border: 0;
      border-radius: var(--radius-round);
      background: var(--color-accent);
      color: var(--color-accent-ink);
      font-size: 1.35rem;
      font-weight: 700;
      box-shadow: var(--shadow-send);
      cursor: pointer;
      transition: transform var(--duration-short) var(--ease-out);
    }

    .send-button:hover { transform: scale(1.04); }
    .send-button:active { transform: scale(0.96); }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 48rem) {
      body { background: var(--color-surface); }
      .editor { box-shadow: 0 0 0 1px var(--color-rule); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="editor" aria-label="Captured photo send review preview">
    <header class="editor__header">
      <button class="header-button" id="cancel" type="button" aria-label="Cancel photo review">Cancel</button>
      <h1 class="editor__title">Photo</h1>
      <button class="header-button" id="more" type="button" aria-label="More photo actions">•••</button>
    </header>

    <section class="photo-stage" id="photo-stage" data-tool="none" data-rotation="0" aria-label="Photo preview">
      <img class="photo-stage__image" src="../../agent/assets/title-figure.png" width="998" height="432" alt="Selected Kordi illustration ready to edit and send" />
      <div class="crop-guide" aria-hidden="true"></div>
      <canvas class="draw-canvas" id="draw-canvas" aria-label="Drawing surface"></canvas>
    </section>

    <footer class="editor__controls">
      <div class="tool-row" aria-label="Photo editing tools">
        <button class="tool-button" id="rotate" type="button" aria-label="Rotate photo" title="Rotate">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M18.5 15a7 7 0 1 1-1.2-8.3L20 9"/></svg>
        </button>
        <button class="tool-button" data-tool="crop" type="button" aria-label="Crop photo" title="Crop" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M2 6h14a2 2 0 0 1 2 2v14"/></svg>
        </button>
        <button class="tool-button" data-tool="draw" type="button" aria-label="Draw on photo" title="Draw" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 4.5 5 5"/><path d="M3 21c3.5 0 4.5-1 4.5-3.5L18 7a2.12 2.12 0 0 0-3-3L4.5 14.5C2 17 2 18 3 21Z"/></svg>
        </button>
      </div>
      <div class="send-row">
        <input class="caption" id="caption" type="text" maxlength="1024" placeholder="Add a caption…" aria-label="Photo caption" />
        <button class="send-button" id="send" type="button" aria-label="Send photo">↑</button>
      </div>
      <p class="visually-hidden" id="status" aria-live="polite">Preview only — no message will be sent.</p>
    </footer>
  </main>

  <script>
    const stage = document.querySelector('#photo-stage');
    const status = document.querySelector('#status');
    const canvas = document.querySelector('#draw-canvas');
    const context = canvas.getContext('2d');
    const strokes = [];
    let activeStroke = null;
    const toolButtons = [...document.querySelectorAll('[data-tool]')].filter((button) => button !== stage);

    function point(event) {
      const bounds = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - bounds.left) / bounds.width,
        y: (event.clientY - bounds.top) / bounds.height,
      };
    }

    function drawStroke(stroke) {
      if (stroke.length === 1) {
        context.beginPath();
        context.arc(stroke[0].x * canvas.clientWidth, stroke[0].y * canvas.clientHeight, 2.5, 0, Math.PI * 2);
        context.fill();
        return;
      }
      context.beginPath();
      stroke.forEach((item, index) => {
        const x = item.x * canvas.clientWidth;
        const y = item.y * canvas.clientHeight;
        if (index === 0) context.moveTo(x, y);
        else context.lineTo(x, y);
      });
      context.stroke();
    }

    function drawSegment(from, to) {
      context.beginPath();
      context.moveTo(from.x * canvas.clientWidth, from.y * canvas.clientHeight);
      context.lineTo(to.x * canvas.clientWidth, to.y * canvas.clientHeight);
      context.stroke();
    }

    function redraw() {
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.round(canvas.clientWidth * ratio);
      canvas.height = Math.round(canvas.clientHeight * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--color-draw');
      context.fillStyle = context.strokeStyle;
      context.lineWidth = 5;
      context.lineCap = 'round';
      context.lineJoin = 'round';
      strokes.forEach(drawStroke);
    }

    new ResizeObserver(redraw).observe(canvas);

    canvas.addEventListener('pointerdown', (event) => {
      if (stage.dataset.tool !== 'draw') return;
      canvas.setPointerCapture(event.pointerId);
      activeStroke = [point(event)];
      strokes.push(activeStroke);
      drawStroke(activeStroke);
    });

    canvas.addEventListener('pointermove', (event) => {
      if (!activeStroke) return;
      const previous = activeStroke[activeStroke.length - 1];
      const next = point(event);
      activeStroke.push(next);
      drawSegment(previous, next);
    });

    function finishStroke(event) {
      if (!activeStroke) return;
      activeStroke = null;
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      status.textContent = 'Drawing added.';
    }

    canvas.addEventListener('pointerup', finishStroke);
    canvas.addEventListener('pointercancel', finishStroke);

    toolButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const tool = button.dataset.tool;
        const nextTool = stage.dataset.tool === tool ? 'none' : tool;
        stage.dataset.tool = nextTool;
        toolButtons.forEach((candidate) => candidate.setAttribute('aria-pressed', String(candidate.dataset.tool === nextTool)));
        status.textContent = nextTool === 'none' ? 'Editing tool closed.' : `${button.getAttribute('title')} tool selected.`;
      });
    });

    document.querySelector('#rotate').addEventListener('click', () => {
      stage.dataset.rotation = String((Number(stage.dataset.rotation) + 90) % 360);
      status.textContent = 'Photo rotated clockwise.';
    });

    document.querySelector('#cancel').addEventListener('click', () => {
      status.textContent = 'Cancel returns to the conversation without attaching the photo.';
    });

    document.querySelector('#more').addEventListener('click', () => {
      status.textContent = 'No additional actions are proposed for this first version.';
    });

    document.querySelector('#send').addEventListener('click', () => {
      const caption = document.querySelector('#caption').value.trim();
      status.textContent = caption
        ? 'Preview: the photo and caption would send together.'
        : 'Preview: the photo would send immediately.';
    });
  </script>
</body>
</html>
