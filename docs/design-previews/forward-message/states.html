<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forward dialog interaction states</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="preview.css"><style>.states {padding: 24px; display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,540px),1fr)); gap: 24px;} iframe {width:100%;height:850px;border:1px solid var(--color-rule);border-radius:16px;} h2 {margin:16px 0;} a {color:var(--color-accent);}</style></head><body><main class="states" id="states"><div><h1>Forward dialog states</h1><p>Sample data. All actions are simulated.</p><a href="index.html">Open interactive preview</a></div></main><script>for (const state of ['default','hover','focus','active','disabled','loading','error','success','empty','selected']) {const section=document.createElement('section');const title=document.createElement('h2');title.textContent=state[0].toUpperCase()+state.slice(1);const frame=document.createElement('iframe');frame.title=state+' forward dialog';frame.src='index.html?state='+state;frame.loading='lazy';section.append(title,frame);document.getElementById('states').append(section);}</script></body></html>
