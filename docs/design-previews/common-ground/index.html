<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kordi Common Ground</title>
<style>
  /* Standalone design preview for Common ground (docs/common-ground.md). Synthetic people, no network calls, system fonts only. */
  :root {
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ground: #e9e8e4; --chrome: #dddcd7; --chrome-on: #ffffff; --chrome-text: #3c3c43;
    --bg: #f2f2f7; --plain: #ffffff; --card: #ffffff;
    --fill: rgba(120,120,128,.12); --fill2: rgba(120,120,128,.2);
    --line: rgba(60,60,67,.14); --line2: rgba(60,60,67,.29);
    --text: #000000; --muted: rgba(60,60,67,.62); --faint: rgba(60,60,67,.3);
    --tint: #2563eb; --primary-fill: #16181d; --primary-text: #fafafa;
    --glass: rgba(255,255,255,.62); --glass-strong: rgba(250,250,252,.86);
    --avatar: #e5e5ea; --avatar-text: #8e8e93;
    --pink: #f83e9c; --cyan: #27b9d1; --amber: #fcb526; --violet: #847ac4; --gray: #8e8e93;
    --green: #34c759; --red: #ff3b30; --red-text: #d70015;
    --dim: rgba(0,0,0,.32);
    --shadow: 0 30px 70px rgba(30,30,25,.22), 0 2px 6px rgba(30,30,25,.08);
    --pop: 0 10px 30px rgba(0,0,0,.14), 0 1px 3px rgba(0,0,0,.08);
    /* macOS window */
    --m-main: #fbfbfc; --m-rail: #efeff2; --m-list: #f6f6f8; --m-win: #ffffff; --m-panel: #ffffff; --m-field: #ffffff;
    --m-line: rgba(0,0,0,.085); --m-line2: rgba(0,0,0,.15); --m-edge: rgba(0,0,0,.18);
    --m-fg: #1d1d1f; --m-fg2: rgba(0,0,0,.6); --m-fg3: rgba(0,0,0,.4);
    --m-hover: rgba(0,0,0,.045); --m-sel: rgba(37,99,235,.11); --m-fill: rgba(0,0,0,.06);
    --m-prim: #16181d; --m-prim-fg: #fafafa; --m-dim: rgba(0,0,0,.2);
    --m-tip: #1d1d1f; --m-tip-fg: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #121214; --chrome: #2c2c2e; --chrome-on: #48484a; --chrome-text: #ebebf5;
      --bg: #000000; --plain: #000000; --card: #1c1c1e;
      --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.34);
      --line: rgba(84,84,88,.6); --line2: rgba(84,84,88,.9);
      --text: #ffffff; --muted: rgba(235,235,245,.6); --faint: rgba(235,235,245,.3);
      --tint: #60a5fa; --primary-fill: #f5f5f5; --primary-text: #16181d;
      --glass: rgba(44,44,46,.7); --glass-strong: rgba(36,36,38,.9);
      --avatar: #3a3a3c; --avatar-text: #aeaeb2;
      --green: #30d158; --red: #ff453a; --red-text: #ff6961; --dim: rgba(0,0,0,.55);
      --shadow: 0 30px 70px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
      --pop: 0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
      --m-main: #17181a; --m-rail: #202124; --m-list: #1c1d20; --m-win: #1f2023; --m-panel: #1f2023; --m-field: #26272a;
      --m-line: rgba(255,255,255,.08); --m-line2: rgba(255,255,255,.14); --m-edge: rgba(255,255,255,.1);
      --m-fg: rgba(255,255,255,.92); --m-fg2: rgba(255,255,255,.6); --m-fg3: rgba(255,255,255,.4);
      --m-hover: rgba(255,255,255,.06); --m-sel: rgba(96,165,250,.17); --m-fill: rgba(255,255,255,.07);
      --m-prim: #f5f5f5; --m-prim-fg: #16181d; --m-dim: rgba(0,0,0,.45);
      --m-tip: #f2f2f7; --m-tip-fg: #1c1c1e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #121214; --chrome: #2c2c2e; --chrome-on: #48484a; --chrome-text: #ebebf5;
    --bg: #000000; --plain: #000000; --card: #1c1c1e;
    --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.34);
    --line: rgba(84,84,88,.6); --line2: rgba(84,84,88,.9);
    --text: #ffffff; --muted: rgba(235,235,245,.6); --faint: rgba(235,235,245,.3);
    --tint: #60a5fa; --primary-fill: #f5f5f5; --primary-text: #16181d;
    --glass: rgba(44,44,46,.7); --glass-strong: rgba(36,36,38,.9);
    --avatar: #3a3a3c; --avatar-text: #aeaeb2;
    --green: #30d158; --red: #ff453a; --red-text: #ff6961; --dim: rgba(0,0,0,.55);
    --shadow: 0 30px 70px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
    --pop: 0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
    --m-main: #17181a; --m-rail: #202124; --m-list: #1c1d20; --m-win: #1f2023; --m-panel: #1f2023; --m-field: #26272a;
    --m-line: rgba(255,255,255,.08); --m-line2: rgba(255,255,255,.14); --m-edge: rgba(255,255,255,.1);
    --m-fg: rgba(255,255,255,.92); --m-fg2: rgba(255,255,255,.6); --m-fg3: rgba(255,255,255,.4);
    --m-hover: rgba(255,255,255,.06); --m-sel: rgba(96,165,250,.17); --m-fill: rgba(255,255,255,.07);
    --m-prim: #f5f5f5; --m-prim-fg: #16181d; --m-dim: rgba(0,0,0,.45);
    --m-tip: #f2f2f7; --m-tip-fg: #1c1c1e;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--text); font: 15px/1.38 var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; }
  button:disabled { cursor: default; }
  input, textarea { font: inherit; color: inherit; margin: 0; }
  :focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
  [hidden] { display: none !important; }
  .ell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Review chrome, outside the device */
  .stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 14px 16px 28px; }
  .top { display: flex; align-items: center; gap: 8px; justify-content: center; }
  .modes { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--chrome); flex: none; }
  .modes button { height: 28px; padding: 0 14px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--chrome-text); }
  .modes button[aria-pressed="true"] { background: var(--chrome-on); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.14); }
  .pickwrap { position: relative; min-width: 0; }
  .pick { height: 34px; width: 220px; max-width: 100%; border-radius: 10px; background: var(--chrome); color: var(--text); border: 0; padding: 0 30px 0 12px; font: 500 13px var(--sans); appearance: none; -webkit-appearance: none; cursor: pointer; text-overflow: ellipsis; }
  .pickwrap svg { position: absolute; right: 10px; top: 50%; width: 12px; height: 12px; transform: translateY(-50%); pointer-events: none; color: var(--chrome-text); stroke-width: 2.4; }
  .themebtn { width: 34px; height: 34px; border-radius: 10px; background: var(--chrome); display: grid; place-items: center; color: var(--chrome-text); flex: none; }
  .themebtn svg { width: 18px; height: 18px; }
  .hint { font-size: 12.5px; color: var(--muted); text-align: center; max-width: 60ch; margin: 0; }
  .macnote { margin-top: 40px; text-align: center; color: var(--muted); font-size: 15px; }

  /* iPhone frame */
  .phone { position: relative; width: 390px; height: 844px; max-height: calc(100dvh - 96px); min-height: 640px; border-radius: 56px; border: 10px solid #0b0b0c; background: var(--bg); box-shadow: var(--shadow); overflow: hidden; flex: none; isolation: isolate; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 60; pointer-events: none; }
  .sbar { position: absolute; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0 40px; font-weight: 600; font-size: 16px; z-index: 55; pointer-events: none; color: var(--text); }
  .sbar .r { display: flex; gap: 6px; align-items: center; }
  /* Scroll edge: content scrolling under the status bar and back button blurs out, like iOS 26. */
  .sbar::before { display: none; }
  .phone.scrolled .sbar::before { display: block; content: ""; position: absolute; inset: 0 0 -72px 0; z-index: -1; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    -webkit-mask-image: linear-gradient(to bottom, #000 60%, transparent); mask-image: linear-gradient(to bottom, #000 60%, transparent); }
  .batt { width: 25px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; position: relative; opacity: .9; }
  .batt::after { content: ""; position: absolute; inset: 1.5px; right: 4px; background: currentColor; border-radius: 1.5px; }
  .homeind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 136px; height: 5px; border-radius: 3px; background: var(--text); opacity: .85; z-index: 55; pointer-events: none; }
  .phone.on-dark .sbar { color: #fff; }
  .phone.on-dark .homeind { background: #fff; }
  .screen { position: absolute; inset: 0; overflow: hidden; }

  /* Pages */
  .pg { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
  .pg.plain { background: var(--plain); }
  .pg.wash::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, rgba(37,99,235,.25) 0%, rgba(37,99,235,.18) 28%, rgba(37,99,235,.07) 52%, transparent 70%); }
  .pg.in { animation: pgin .32s cubic-bezier(.2,.8,.2,1); }
  .pg.bk { animation: pgbk .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes pgin { from { transform: translateX(34px); opacity: 0; } }
  @keyframes pgbk { from { transform: translateX(-24px); opacity: .4; } }
  .scroll { position: relative; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 106px 16px 32px; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .scroll.mid { display: flex; flex-direction: column; justify-content: center; padding-top: 96px; }
  .pg.root .scroll { padding-top: 56px; padding-bottom: 110px; }
  .pg.flat .scroll { padding-left: 20px; padding-right: 20px; }
  .glassbtn { width: 44px; height: 44px; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(1.6); backdrop-filter: blur(16px) saturate(1.6); box-shadow: inset 0 0 0 .5px var(--line), 0 2px 10px rgba(0,0,0,.06); display: grid; place-items: center; color: var(--text); flex: none; }
  .glassbtn:active { transform: scale(.95); }
  .glassbtn.dark { background: rgba(30,30,32,.45); color: #fff; box-shadow: inset 0 0 0 .5px rgba(255,255,255,.18); }
  .back { position: absolute; top: 52px; left: 16px; z-index: 20; }
  .back svg { width: 22px; height: 22px; stroke-width: 2.1; }
  .navttl { position: absolute; top: 52px; left: 72px; right: 72px; height: 44px; line-height: 44px; text-align: center; font-weight: 600; font-size: 17px; z-index: 19; }
  .dock { position: relative; flex: none; padding: 8px 16px 32px; background: var(--bg); }
  .dock::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 24px; background: linear-gradient(to top, var(--bg), transparent); pointer-events: none; }
  .dock .primary { margin-top: 0; }
  .dock .err { margin: 0 0 10px; }

  /* Hero, avatars, action tiles (session-detail look) */
  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .hero h1 { margin: 12px 0 0; font-size: 24px; font-weight: 700; letter-spacing: -.01em; line-height: 1.22; max-width: 100%; }
  .hero h1.one { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hero .line { color: var(--muted); font-size: 15px; margin-top: 3px; max-width: 32ch; text-wrap: balance; }
  .hero .line.one { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .avatar { border-radius: 50%; background: var(--avatar); color: var(--avatar-text); display: grid; place-items: center; font-weight: 500; flex: none; box-shadow: 0 0 0 .5px var(--line) inset; letter-spacing: .01em; }
  .avatar.ring { box-shadow: 0 0 0 3px var(--bg); }
  .avatar.lift { box-shadow: 0 4px 10px rgba(0,0,0,.08), 0 0 0 .5px var(--line) inset; }
  .grid-av { display: grid; align-content: center; justify-content: center; flex: none; }
  .grid-av div { background: var(--avatar); color: var(--avatar-text); display: grid; place-items: center; font-weight: 500; border-radius: 50%; }
  .pair { display: flex; }
  .pair .avatar + .avatar { margin-left: -14px; }
  .badge { margin-top: -12px; background: var(--tint); color: #fff; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; box-shadow: 0 0 0 2px var(--bg); position: relative; font-variant-numeric: tabular-nums; }
  .stack { display: flex; align-items: center; flex: none; }
  .stack .avatar { box-shadow: 0 0 0 2px var(--card); }
  .stack .avatar + .avatar { margin-left: -3px; }
  .stack .more { margin-left: 6px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .actions { display: grid; gap: 10px; width: 100%; margin-top: 18px; }
  .tile { min-height: 62px; border-radius: 18px; background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: inset 0 0 0 .5px var(--line); color: var(--tint); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 8px 4px; transition: opacity .2s, color .2s; text-align: center; }
  .tile svg { width: 22px; height: 22px; }
  .tile:active { transform: scale(.97); }
  .tile.off { opacity: .42; }
  .tile.wait { color: var(--muted); }

  /* Grouped sections (CommonGroundSection, 14 pt) */
  .section { margin-top: 18px; }
  .section-title { color: var(--muted); font-weight: 600; font-size: 14px; margin: 0 16px 8px; }
  .group { background: var(--card); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 16px; min-height: 52px; position: relative; width: 100%; text-align: left; }
  .row + .row::before, .row + .rowbtn::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 16px); border-top: .5px solid var(--line); }
  button.row:active, .row.click:active { background: var(--fill); }
  .row.click { cursor: pointer; }
  .row .grow { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .title { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub.two { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row .trail { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; flex: none; }
  .row .chev { color: var(--faint); flex: none; }
  .row .chev svg { width: 16px; height: 16px; stroke-width: 2.4; }
  .row .empty { color: var(--muted); }
  .rowbtn { position: relative; display: block; width: 100%; height: 46px; text-align: center; color: var(--tint); font-weight: 600; font-size: 16px; }
  .rowbtn:active { background: var(--fill); }
  .icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
  .icon svg.i { width: 17px; height: 17px; }
  .small-btn { border: 0; background: var(--tint); color: #fff; border-radius: 999px; height: 30px; padding: 0 14px; font: 600 13px var(--sans); flex: none; white-space: nowrap; }
  .small-btn.gray { background: var(--fill); color: var(--text); }
  .small-btn:disabled { opacity: .45; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; }
  .seg button { color: var(--text); font-size: 13px; font-weight: 500; height: 28px; border-radius: 7px; text-align: center; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
  .primary { display: block; width: 100%; min-height: 52px; border-radius: 999px; background: var(--primary-fill); color: var(--primary-text); font-size: 17px; font-weight: 600; text-align: center; margin-top: 20px; }
  .primary:disabled { opacity: .42; }
  .primary:not(:disabled):active { opacity: .82; }
  .link { display: block; width: 100%; color: var(--tint); font-size: 16px; font-weight: 600; padding: 14px; text-align: center; margin-top: 8px; }
  .err { color: var(--red-text); text-align: center; font-size: 14px; min-height: 20px; }
  textarea.ta { display: block; width: 100%; min-height: 84px; border: 0; resize: none; background: transparent; color: var(--text); font-size: 16px; line-height: 1.35; padding: 12px 16px; outline: none; }
  textarea.ta::placeholder, input.field::placeholder { color: var(--faint); }
  input.field { display: block; width: 100%; height: 50px; border: 0; background: transparent; color: var(--text); font-size: 17px; padding: 0 16px; outline: none; }
  .sw { position: relative; width: 51px; height: 31px; border-radius: 16px; background: var(--fill2); transition: background .2s; flex: none; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.1); transition: transform .2s; }
  .sw[aria-checked="true"] { background: var(--green); }
  .sw[aria-checked="true"]::after { transform: translateX(20px); }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--fill2); border-top-color: var(--tint); animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Tags (8 pt radius, tinted by topic) */
  .tags { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px; }
  .tag { display: inline-flex; align-items: center; gap: 7px; height: 32px; max-width: 100%; padding: 0 6px 0 11px; border-radius: 8px; font-size: 14px; font-weight: 500; line-height: 1.2; color: var(--text); }
  .tag i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tag .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .tag.ref { padding-right: 12px; cursor: pointer; }
  .tag.ro { padding-right: 12px; }
  .tag.ro .txt { cursor: default; }
  .tag-x { width: 20px; height: 20px; border-radius: 5px; color: var(--muted); font-size: 16px; line-height: 1; display: grid; place-items: center; flex: none; }
  .tag-x:hover { background: var(--line); color: var(--text); }
  .tag.add { background: var(--fill); color: var(--muted); padding: 0 12px 0 10px; gap: 5px; }
  .tag.add:hover { color: var(--text); }
  .tag.add svg { width: 14px; height: 14px; stroke-width: 2.2; }
  .tag.add.editing { cursor: text; padding: 0 11px; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--tint) 55%, transparent); background: var(--card); }
  .tag.add.editing i { background: var(--faint); }
  .tag.add input { border: 0; outline: none; background: transparent; color: var(--text); font: 500 14px var(--sans); padding: 0; min-width: 0; flex: 1 1 auto; }
  .tag.add .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
  .tag.add .count.full { color: var(--red-text); }
  .tag.small { height: 26px; padding: 0 9px; font-size: 13px; gap: 6px; border-radius: 6px; }
  .tag.small i { width: 7px; height: 7px; }
  .tag.muted { background: var(--fill) !important; color: var(--muted); }
  .tag.muted i { background: var(--faint) !important; }
  .timeline { padding: 6px 0; }
  .tl-row { display: grid; grid-template-columns: 96px minmax(0, 1fr); column-gap: 6px; }
  .tl-when { position: relative; padding: 14px 0 0 30px; color: var(--muted); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tl-when::before { content: ""; position: absolute; left: 17px; top: 0; bottom: 0; width: 1.5px; background: var(--line); }
  .tl-row:first-child .tl-when::before { top: 20px; }
  .tl-row:last-child .tl-when::before { bottom: calc(100% - 20px); }
  .tl-when::after { content: ""; position: absolute; left: 13px; top: 16px; width: 9px; height: 9px; border-radius: 50%; background: var(--tint); box-shadow: 0 0 0 3px var(--card); }
  .tl-row.past .tl-when::after { background: var(--faint); }
  .tl-row .tags { padding: 10px 14px 10px 0; gap: 6px; min-width: 0; }

  /* Kordi mark, pulse, building steps */
  .mark { position: relative; width: 64px; height: 64px; flex: none; }
  .mark i { position: absolute; width: 48%; height: 48%; border-radius: 50%; opacity: .92; animation: relay 1.65s ease-in-out infinite; }
  .mark i:nth-child(1) { background: var(--pink); left: 26%; top: 11%; }
  .mark i:nth-child(2) { background: var(--cyan); left: 9%; top: 41%; animation-delay: .25s; }

// Fake QR: finder squares, timing rows and a seeded module grid. It does not scan.
function qrSVG(seed = 7) {
  const N = 25; let s = seed >>> 0;
  const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  const m = Array.from({ length: N }, () => Array(N).fill(false));
  const res = Array.from({ length: N }, () => Array(N).fill(false));
  const finder = (x, y) => { for (let i = -1; i <= 7; i++) for (let j = -1; j <= 7; j++) { const xx = x + i, yy = y + j; if (xx < 0 || yy < 0 || xx >= N || yy >= N) continue; res[yy][xx] = true; const ring = i === 0 || i === 6 || j === 0 || j === 6; const core = i >= 2 && i <= 4 && j >= 2 && j <= 4; m[yy][xx] = i >= 0 && i <= 6 && j >= 0 && j <= 6 && (ring || core); } };
  finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
  for (let i = 8; i < N - 8; i++) { m[6][i] = m[i][6] = i % 2 === 0; res[6][i] = res[i][6] = true; }
  for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) { const x = 18 + i, y = 18 + j; res[y][x] = true; m[y][x] = Math.max(Math.abs(i), Math.abs(j)) !== 1; }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!res[y][x]) m[y][x] = rnd() > 0.52;
  let d = '';
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (m[y][x]) d += `M${x} ${y}h1v1h-1z`;
  return `<svg viewBox="-1 -1 ${N + 2} ${N + 2}" shape-rendering="crispEdges" aria-label="Pairing QR code"><rect x="-1" y="-1" width="${N + 2}" height="${N + 2}" fill="#fff"/><path d="${d}" fill="#111"/></svg>`;
}

  const wrap = (inner, cls = '') => `<div class="m-dim" data-act="mClose"><div class="m-dlg ${cls}" role="dialog" data-stop>${inner}</div></div>`;
  const head = (t) => `<div class="dh"><h3>${esc(t)}</h3><button class="m-iconbtn" data-act="mClose" aria-label="Close">${ic('close')}</button></div>`;
  if (d.type === 'refs') return wrap(`${head(d.topic)}<div class="db">${refWhen(d.topic) ? `<div class="when">${refWhen(d.topic)}</div>` : ''}<div class="m-panel">${refRows(d.topic)}</div></div>`);
  if (d.type === 'member') { const p = P[d.id]; return wrap(`<div class="dh">${avatar(d.id, 40)}<div class="ell" style="flex:1"><h3>${esc(p.name)}</h3><div class="m-line">${esc(p.lab)}</div></div><button class="m-iconbtn" data-act="mClose" aria-label="Close">${ic('close')}</button></div><div class="db">${personCardSections(d.id, 'mac').replace('<div class="m-sec">', '<div class="m-sec" style="margin-top:6px">')}</div>`); }
  if (d.type === 'group') {

    return wrap(`${head('Start group')}<div class="db"><div class="m-sec">Name</div><input class="mfield" id="gname" data-model="gname" value="${esc(g.name)}" maxlength="60" style="width:100%"><div class="m-sec">Members</div><div class="m-panel">${rows}</div></div><div class="df"><button class="mbtn" data-act="mClose">Cancel</button><button class="mbtn prim" data-act="createGroup" data-create ${g.name.trim() && g.sel.length ? '' : 'disabled'}>Create</button></div>`);
  }
  if (d.type === 'meet') {
    const m = S.meet;
    return wrap(`${head(`Meet ${firstName(m.id)}`)}<div class="db"><div class="m-panel"><div class="m-row" style="--inset:48px"><div class="icon" style="background:var(--tint)">${ic('calendar')}</div><div class="grow"><div class="tt">${MEET_TIMES[m.time]} · 15 min</div><div class="sub">Free for both of you</div></div></div>${meetChips(m)}</div>
      <div class="m-sec">Where</div><input class="mfield" id="meetPlace" data-model="meetPlace" value="${esc(m.place)}" maxlength="60" style="width:100%"></div><div class="df"><button class="mbtn" data-act="mClose">Cancel</button><button class="mbtn prim" data-act="sendMeet">Send</button></div>`, 'sm');
  }
  if (d.type === 'settings') {
    return wrap(`${head('Common ground')}<div class="db"><div class="m-panel">
      <div class="m-row"><div class="grow"><div class="tt">Share my card</div><div class="sub">Off hides you from new rooms and pairings.</div></div><button class="sw" role="switch" aria-checked="${S.sharing}" data-act="share" aria-label="Share my card"></button></div>
      <div class="m-row"><div class="grow"><div class="tt">Sources</div><div class="sub">${onCount()} on</div></div><button class="mbtn" data-act="mPhase" data-a="sources">Edit</button></div>
      <div class="m-row"><div class="grow"><div class="tt">Delete card</div><div class="sub">People you met can no longer see it.</div></div><button class="mbtn danger" data-act="mDialog" data-a="delete" ${S.hasCard ? '' : 'disabled'}>Delete card</button></div></div></div>`);
  }
  if (d.type === 'delete') return wrap(`${head('Delete your card?')}<div class="db"><div class="msg">People you met can no longer see it.</div></div><div class="df"><button class="mbtn" data-act="mDialog" data-a="settings">Cancel</button><button class="mbtn prim danger" data-act="deleteCard">Delete card</button></div>`, 'sm');
  if (d.type === 'sharing') return wrap(`${head('Sharing is off')}<div class="db"><div class="msg">Turn it on so people can find you.</div></div><div class="df"><button class="mbtn" data-act="mClose">Not now</button><button class="mbtn prim" data-act="sharingOn">Turn on sharing</button></div>`, 'sm');
  if (d.type === 'alert') {
    const src = DEVICE_SRC.find((x) => x.id === d.src);
    return `<div class="m-dim"><div class="m-dlg m-sysalert" role="alertdialog"><div class="appic">${ic(src.icon)}</div><b>“Kordi” would like to access your ${src.id === 'calendar' ? 'calendar' : 'reminders'}.</b><p>Kordi reads titles and dates to build your card.</p><div class="two"><button class="mbtn" data-act="permit" data-a="${src.id}:denied">Don’t Allow</button><button class="mbtn tint" data-act="permit" data-a="${src.id}:granted">Allow</button></div></div></div>`;
  }
  return '';
}
function renderMac() {
  const root = $('#mac');
  if (!S.hasCard && S.mac.phase === 'page') S.mac.phase = 'intro';
  const keepL = $('#mLeft') ? $('#mLeft').scrollTop : 0, keepR = $('#mRight') ? $('#mRight').scrollTop : 0;
  const prevRight = root.dataset.right || '';
  const curRight = S.mac.sel + ':' + S.mac.phase + ':' + rtop().id + ':' + (rtop().arg || '');
  const keepToast = $$('.m-toast', root);
  const keepList = $('#mList') ? $('#mList').scrollTop : 0;
  root.innerHTML = `${railMac()}${contactsMac()}${detailMac()}${dialogMac()}`;
  if ($('#mList')) $('#mList').scrollTop = keepList;
  keepToast.forEach((t) => root.appendChild(t));
  root.dataset.right = curRight;
  if ($('#mLeft')) $('#mLeft').scrollTop = keepL;
  if ($('#mRight') && prevRight === curRight) $('#mRight').scrollTop = keepR;
  const inp = $('#newtag'); if (inp) inp.focus();
  syncPick();
}
function macJoin() {
  const code = S.mac.digits.join('');
  if (code.length < 4 || S.locked) return;
  if (!guard('join')) return;
  const res = checkCode(code);
  S.mac.digits = ['', '', '', ''];
  if (res === 'room') { S.joinErr = ''; S.tries = 0; S.room = newRoom(ROOM_CODE, ROOM_NAME, { members: ['maya'] }); mGo('lobby'); return; }
  if (res === 'new') { S.joinErr = ''; S.roomDraft = ''; mGo('name', code); return; }
  S.tries += 1;
  if (S.tries >= 3) { S.locked = true; S.joinErr = 'Try again in a minute.'; } else S.joinErr = 'Room not found';
  renderMac();
  const f = $('.m-dig'); if (f && !S.locked) f.focus();
}

function iosJoin(code) {
  if (itop().id !== 'join') return;
  const res = checkCode(code);
  if (res === 'room') { S.joinErr = ''; S.tries = 0; S.code = ''; S.room = newRoom(ROOM_CODE, ROOM_NAME, { members: ['maya'] }); replace('lobby'); return; }
  if (res === 'new') { S.joinErr = ''; S.code = ''; S.roomDraft = ''; replace('nameRoom', code); return; }
  S.tries += 1; S.code = '';
  if (S.tries >= 3) { S.locked = true; S.joinErr = 'Try again in a minute.'; } else S.joinErr = 'Room not found';
  renderIOS();
  const d = $('#dots'); if (d) { d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); }
}
function updateBuildBtn() { const b = $('[data-build]'); if (b) b.disabled = !buildReady(); }

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  // Clicks inside a Mac dialog never close it through the backdrop.
  if (el.classList.contains('m-dim') && e.target.closest('[data-stop]')) return;
  if (el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset.a, el, e); }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'newtag') {
    const n = t.value.length; t.size = Math.max(9, n + 1);
    const c = t.nextElementSibling; c.textContent = n >= 30 ? `${n}/40` : ''; c.classList.toggle('full', n >= 40);
    return;
  }
  if (t.classList.contains('m-dig')) {
    const i = Number(t.dataset.i); t.value = t.value.replace(/\D/g, '').slice(-1); S.mac.digits[i] = t.value;
    if (S.joinErr && !S.locked) { S.joinErr = ''; const el = $('.m-errline'); if (el) el.remove(); }
    if (t.value && i < 3) { const nx = $(`.m-dig[data-i="${i + 1}"]`); if (nx) nx.focus(); }
    const b = $('[data-join]'); if (b) b.disabled = S.mac.digits.join('').length !== 4;
    if (S.mac.digits.join('').length === 4) T.set(macJoin, 220);
    return;
  }
  const m = t.dataset.model; if (!m) return;
  if (m === 'links' || m === 'notes') { S[m] = t.value; updateBuildBtn(); }
  else if (m === 'pairCode') { S.pairCode = t.value.toUpperCase(); const b = $('[data-pair]'); if (b) b.disabled = S.pairCode.trim().length < 6; }
  else if (m === 'roomDraft') S.roomDraft = t.value;
  else if (m === 'gname') { S.group.name = t.value; const b = $('[data-create]'); if (b) b.disabled = !(t.value.trim() && S.group.sel.length); }
  else if (m === 'meetPlace') S.meet.place = t.value;
});
function commitTag(save) {
  const inp = $('#newtag'); if (!inp || !S.adding) return;
  const key = S.adding, text = inp.value.replace(/\s+/g, ' ').trim();
  S.adding = null;
  if (save && text && !S.card[key].some((x) => x.toLowerCase() === text.toLowerCase())) S.card[key].push(text);
  render();
}
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'newtag') { if (e.key === 'Enter') { e.preventDefault(); commitTag(true); } else if (e.key === 'Escape') commitTag(false); return; }
  if (e.target.classList && e.target.classList.contains('m-dig')) {
    if (e.key === 'Backspace' && !e.target.value) { const p = $(`.m-dig[data-i="${Number(e.target.dataset.i) - 1}"]`); if (p) { p.focus(); p.value = ''; S.mac.digits[Number(p.dataset.i)] = ''; } }
    if (e.key === 'Enter') macJoin();
    return;
  }
  if (e.key === 'Escape') { if (isIOS() && S.ios.sheet) ACT.closeSheet(); else if (!isIOS() && S.mac.dialog) ACT.mClose(); return; }
  if (isIOS() && itop().id === 'join' && !S.ios.sheet && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) {
    if (/^\d$/.test(e.key)) ACT.key(e.key); else if (e.key === 'Backspace') ACT.key('del');
  }
});
document.addEventListener('focusout', (e) => { if (e.target.id === 'newtag') setTimeout(() => commitTag(true), 0); });

  'm-card-first': () => { S.firstVisit = true; },
  'm-page': () => {},
  'm-contact': () => { S.mac.sel = 'maya'; },
  'm-refs': () => { S.mac.dialog = { type: 'refs', topic: 'Agent memory' }; },
  'm-settings': () => { S.mac.dialog = { type: 'settings' }; },
  'm-invite-waiting': () => { S.inviteWaiting = true; },
  'm-name': () => { S.mac.rstack = [{ id: 'pair' }, { id: 'name', arg: '3907' }]; },
  'm-lobby': () => { S.room = lobbyRoom(); S.mac.rstack = [{ id: 'pair' }, { id: 'lobby' }]; return () => startArrivals(); },
  'm-member': () => { S.room = fullRoom(); S.mac.rstack = [{ id: 'pair' }, { id: 'lobby' }]; S.mac.dialog = { type: 'member', id: 'oskar' }; },
  'm-results': () => { S.room = fullRoom(); S.mac.rstack = [{ id: 'pair' }, { id: 'results' }]; },
  'm-group': () => { S.room = fullRoom(); S.mac.rstack = [{ id: 'pair' }, { id: 'results' }]; openGroup(); S.mac.dialog = { type: 'group' }; },
  'm-invite': () => { S.room = fullRoom(); S.mac.rstack = [{ id: 'pair' }, { id: 'invite' }]; },
  'm-match': () => { S.mac.rstack = [{ id: 'pair' }, { id: 'match', arg: 'oskar' }]; },
  'm-trade': () => { S.matchTab = 'trade'; S.mac.rstack = [{ id: 'pair' }, { id: 'match', arg: 'oskar' }]; },
  'm-meet': () => { S.mac.rstack = [{ id: 'pair' }, { id: 'match', arg: 'oskar' }]; openMeet('oskar'); S.mac.dialog = { type: 'meet' }; },
  'm-no-overlap': () => { S.mac.rstack = [{ id: 'pair' }, { id: 'match', arg: 'elio' }]; },
  'm-failed': () => { S.hasCard = false; S.on.memory = true; S.on.gmail = true; S.buildError = true; S.mac.phase = 'sources'; },
  'm-denied': () => { S.hasCard = false; S.dev.calendar = 'denied'; S.mac.phase = 'sources'; },
  'm-alone': () => { S.room = newRoom('3907', 'Lab lunch', { created: true, alone: true }); S.mac.rstack = [{ id: 'pair' }, { id: 'lobby' }]; },
  'm-notfound': () => { S.tries = 1; S.joinErr = 'Room not found'; },
  'm-locked': () => { S.tries = 3; S.locked = true; S.joinErr = 'Try again in a minute.'; },
  'm-offline': () => { S.offline = true; return () => toast("You're offline", true); },
  'm-sharing': () => { S.sharing = false; S.mac.dialog = { type: 'sharing' }; },
};
function jump(key) {
  T.clear(); clearToasts();
  S = freshState(S.mode);
  const after = PRESET[key] && PRESET[key]();
  S.lastJump = key;
  if (S.mode === 'ios') { renderIOS('in'); if (!S.ios.sheet || S.ios.sheet.type !== 'sharing') enterIOS(itop().id, itop().arg); }
  else renderMac();
  if (after) after();
  S.lastJump = key; syncPick();
}
function currentKey() {
  if (S.lastJump) return S.lastJump;
  if (S.mode === 'ios') {
    const t = itop();
    const map = { contacts: S.hasCard ? (S.inviteWaiting ? 'i-contacts-badge' : 'i-contacts') : 'i-contacts-new', cgSettings: 'i-settings', intro: 'i-intro', sources: 'i-sources', building: 'i-building', card: S.firstVisit ? 'i-card-first' : 'i-card', home: 'i-home', tap: S.ios.tapMode === 'qr' ? 'i-qr' : 'i-tap', scan: 'i-scan', join: 'i-join', nameRoom: 'i-name', lobby: 'i-lobby', results: 'i-results', invite: 'i-invite', match: S.matchTab === 'trade' ? 'i-trade' : 'i-match' };
    return map[t.id] || '';
  }
  if (S.mac.sel !== 'cg') return 'm-contact';
  if (S.mac.phase !== 'page') return { intro: 'm-intro', sources: 'm-sources', building: 'm-building' }[S.mac.phase];
  const r = rtop().id;
  return { pair: S.firstVisit ? 'm-card-first' : 'm-page', name: 'm-name', lobby: 'm-lobby', results: 'm-results', invite: 'm-invite', match: S.matchTab === 'trade' ? 'm-trade' : 'm-match' }[r] || '';
}
function fillPick() {
  $('#pick').innerHTML = `<option value="" disabled>Screen</option>` + PICKS[S.mode].map(([g, opts]) => `<optgroup label="${esc(g)}">${opts.map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join('')}</optgroup>`).join('');
}
function syncPick() { const k = currentKey(); $('#pick').value = k && $(`#pick option[value="${k}"]`) ? k : ''; }
const HINTS = {
  ios: 'Start from the hug icon in the Contacts toolbar. Room codes: 4821 joins a room, 0000 is not found, any other code opens a new room.',
  mac: 'Common ground is the pinned row in Contacts. Room codes: 4821 joins a room, 0000 is not found, any other code opens a new room. Any six-character pairing code opens a match.',
};
function fitMac() {
  const narrow = window.innerWidth < 640, mac = S.mode === 'mac';
  $('#macwrap').hidden = !mac || narrow; $('#macnote').hidden = !mac || !narrow;
  if (!mac || narrow) return;
  const k = Math.min(1, (window.innerWidth - 32) / 1180);
  $('#mac').style.transform = `scale(${k})`;
  $('#macwrap').style.width = Math.round(1180 * k) + 'px'; $('#macwrap').style.height = Math.round(760 * k) + 'px';
}
function setMode(mode) {
  T.clear(); clearToasts();
  S.mode = mode; S.lastJump = null;
  $('#modeIos').setAttribute('aria-pressed', mode === 'ios'); $('#modeMac').setAttribute('aria-pressed', mode === 'mac');
  $('#phone').hidden = mode !== 'ios';
  $('#hint').textContent = HINTS[mode];
  fillPick(); fitMac();
  if (mode === 'ios') { S.ios.sheet = null; renderIOS(); } else { S.mac.dialog = null; S.mac.finding = false; renderMac(); }
  if (S.offline) toast("You're offline", true);
}
function isDark() { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches; }
function paintThemeBtn() { $('#themeBtn').innerHTML = ic(isDark() ? 'sun' : 'moon'); $('#themeBtn').title = isDark() ? 'Light' : 'Dark'; }
$('#themeBtn').addEventListener('click', () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; paintThemeBtn(); });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeBtn);
$('#modeIos').addEventListener('click', () => setMode('ios'));
$('#modeMac').addEventListener('click', () => setMode('mac'));
$('#pick').addEventListener('change', (e) => { if (e.target.value) jump(e.target.value); });
window.addEventListener('resize', fitMac);
paintThemeBtn();
setMode('ios');
// Show the scroll-edge blur only once content scrolls under the status bar.
document.addEventListener('scroll', (e) => {
  const phone = document.getElementById('phone');
  if (phone && e.target instanceof Element && phone.contains(e.target)) phone.classList.toggle('scrolled', e.target.scrollTop > 4);
}, true);
new MutationObserver(() => document.getElementById('phone')?.classList.remove('scrolled'))
  .observe(document.getElementById('screen'), { childList: true });
</script>
