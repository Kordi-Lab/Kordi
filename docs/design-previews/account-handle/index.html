<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Custom Kordi ID · Kordi proposal</title>
<style>
:root{
  --font:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
  --page:#e9e9ee;--chrome:#fff;--chrome-text:#1c1c1e;--chrome-muted:rgba(60,60,67,.6);--chip:rgba(120,120,128,.12);
  /* Mac dialog tokens (light): theme-palette.css + theme-shell-controls.css, hue 250 */
  --m-canvas:oklch(95.5% .012 250);--m-rail:oklch(93.6% .015 250);--m-ink:rgb(15 23 42);--m-300:rgb(71 85 105);
  --m-400:rgb(82 94 109);--m-500:rgb(73 83 97);--m-border:oklch(36% .025 250 / .15);--m-divider:oklch(36% .025 250 / .10);
  --m-danger:rgb(190 18 60 / .18);--m-error:rgb(159 18 57);--m-accent:#365F98;--m-accent-ink:oklch(98% .005 250);
  --m-selected:oklch(36% .025 250 / .08);--m-shadow:0 14px 36px rgb(0 0 0 / .16);
  /* iOS tokens (light): X-style edit profile, Kordi iOS blue */
  --i-page:#fff;--i-label:#000;--i-secondary:rgba(60,60,67,.6);--i-tertiary:rgba(60,60,67,.3);
  --i-accent:#365F98;--i-red:#9F1239;--i-hair:rgba(0,0,0,.12);
  --i-banner-a:oklch(91% .025 255);--i-banner-b:oklch(86% .035 260);--i-banner-edge:rgba(0,0,0,.12);
  --i-cam:rgba(0,0,0,.4);--i-cam-ink:#fff;--i-av-a:#7d8ba3;--i-av-b:#55617a;
  --i-bezel:#0b0b0c;--i-shadow:0 30px 70px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.08);
}
:root[data-theme="dark"]{
  --page:#141416;--chrome:#1c1c1e;--chrome-text:#f2f2f7;--chrome-muted:rgba(235,235,245,.6);--chip:rgba(120,120,128,.24);
  --m-canvas:oklch(21.5% .018 250);--m-rail:oklch(19.5% .02 250);--m-ink:#fff;--m-300:#cbd5e1;--m-400:#94a3b8;--m-500:#64748b;
  --m-border:oklch(85% .018 250 / .16);--m-divider:oklch(85% .018 250 / .10);--m-danger:rgb(251 113 133 / .24);--m-error:#fecdd3;
  --m-accent:#AEC4E3;--m-accent-ink:oklch(22% .025 250);--m-selected:oklch(85% .018 250 / .09);--m-shadow:0 14px 36px rgb(0 0 0 / .28);
  --i-page:#000;--i-label:#fff;--i-secondary:rgba(235,235,245,.6);--i-tertiary:rgba(235,235,245,.3);
  --i-accent:#AEC4E3;--i-red:#FDA4AF;--i-hair:rgba(255,255,255,.18);
  --i-banner-a:oklch(29% .03 255);--i-banner-b:oklch(23% .025 260);--i-banner-edge:rgba(255,255,255,.18);
  --i-cam:rgba(0,0,0,.4);--i-cam-ink:#fff;--i-av-a:#7d8ba3;--i-av-b:#55617a;
  --i-bezel:#2a2a2d;--i-shadow:0 30px 70px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#141416;--chrome:#1c1c1e;--chrome-text:#f2f2f7;--chrome-muted:rgba(235,235,245,.6);--chip:rgba(120,120,128,.24);
  --m-canvas:oklch(21.5% .018 250);--m-rail:oklch(19.5% .02 250);--m-ink:#fff;--m-300:#cbd5e1;--m-400:#94a3b8;--m-500:#64748b;
  --m-border:oklch(85% .018 250 / .16);--m-divider:oklch(85% .018 250 / .10);--m-danger:rgb(251 113 133 / .24);--m-error:#fecdd3;
  --m-accent:#AEC4E3;--m-accent-ink:oklch(22% .025 250);--m-selected:oklch(85% .018 250 / .09);--m-shadow:0 14px 36px rgb(0 0 0 / .28);
  --i-page:#000;--i-label:#fff;--i-secondary:rgba(235,235,245,.6);--i-tertiary:rgba(235,235,245,.3);
  --i-accent:#AEC4E3;--i-red:#FDA4AF;--i-hair:rgba(255,255,255,.18);
  --i-banner-a:oklch(29% .03 255);--i-banner-b:oklch(23% .025 260);--i-banner-edge:rgba(255,255,255,.18);
  --i-cam:rgba(0,0,0,.4);--i-cam-ink:#fff;--i-av-a:#7d8ba3;--i-av-b:#55617a;
  --i-bezel:#2a2a2d;--i-shadow:0 30px 70px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--chrome-text);font-family:var(--font);-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding:12px 20px;background:var(--chrome);font-size:13px;color:var(--chrome-muted);border-bottom:1px solid var(--chip)}
.bar strong{color:var(--chrome-text);font-weight:600}
.seg{display:inline-flex;gap:2px;background:var(--chip);border-radius:8px;padding:2px;margin-left:6px}
.seg button{font:inherit;font-size:12px;border:0;background:transparent;color:var(--chrome-text);padding:4px 10px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chrome);box-shadow:0 1px 2px rgba(0,0,0,.18);font-weight:600}
.stage{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;padding:24px 20px 32px;overflow-x:auto}
.cap{font-size:12px;font-weight:600;color:var(--chrome-muted);margin:0 0 8px 4px}
.tag{font-size:11px;font-weight:600;color:#2563eb;background:rgba(37,99,235,.12);padding:2px 8px;border-radius:10px;margin-left:6px}
svg{display:block}

/* ---------- Mac ---------- */
.dlg{width:900px;height:680px;max-width:calc(100vw - 40px);display:grid;grid-template-columns:208px minmax(0,1fr);border-radius:12px;overflow:hidden;background:var(--m-canvas);color:var(--m-ink);box-shadow:var(--m-shadow);font-size:13px}
.rail{background:var(--m-rail);border-right:1px solid var(--m-divider);padding:20px 12px 12px}
.search{display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--m-border);border-radius:8px;padding:0 10px;color:var(--m-500)}
.ngroup{padding-top:20px}
.nlabel{padding:0 10px 6px;font-size:12px;font-weight:500;color:var(--m-500)}
.nitem{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;color:var(--m-300);margin-bottom:2px}
.nitem.on{background:var(--m-selected);color:var(--m-ink);font-weight:500}
.nitem svg{color:var(--m-400)}.nitem.on svg{color:var(--m-ink)}
.mpage{display:flex;flex-direction:column;min-width:0}
.mhead{height:56px;flex:0 0 56px;display:flex;justify-content:flex-end;align-items:center;padding:0 16px;border-bottom:1px solid var(--m-divider)}
.xbtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--m-300)}
.mbody{padding:8px 32px 32px;overflow:auto}
.section{max-width:620px}
.section h2{margin:0;padding-bottom:8px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.av{border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;background:linear-gradient(140deg,#7d8ba3,#55617a)}
.caret{display:inline-block;width:1px;height:16px;background:var(--m-ink);margin-left:1px;vertical-align:-3px}
.merr{font-size:12px;line-height:20px;font-weight:400;color:var(--m-error);margin-top:-2px}
.rows>div{border-top:1px solid var(--m-divider)}
.rows>div:first-child{border-top:0}
.row{display:flex;align-items:center;gap:12px;min-height:32px;padding:14px 0;box-sizing:content-box}
.rt{flex:1;min-width:0}.rt b{display:block;font-weight:500;line-height:20px}
.rt span{display:block;margin-top:2px;font-size:12px;line-height:20px;color:var(--m-400)}
.rv{color:var(--m-300);max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.btn{height:32px;border-radius:8px;padding:0 14px;border:0;font:inherit;font-size:12px;font-weight:500;background:var(--m-accent);color:var(--m-accent-ink);cursor:pointer}
.mr{display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;column-gap:12px;min-height:46px;padding:7px 0;border-top:1px solid var(--m-divider)}
.mr.top{align-items:start}.mr.top>b{padding-top:5px}
.mr>b{font-weight:500;line-height:20px}
.mv{display:flex;align-items:center;min-height:30px;margin:0 -6px;padding:0 6px;border-radius:6px;color:var(--m-accent);line-height:20px;min-width:0}
.mv.focus{outline:2px solid color-mix(in oklab,var(--m-accent) 42%,transparent)}
.mv .pre{color:var(--m-400)}.mv .ph{color:var(--m-500)}.mv.ro{color:var(--m-300)}
.mv .bad{color:var(--m-error)}.mv .chev{margin-left:auto;color:var(--m-500)}
.mv .caret{background:var(--m-accent)}
.mr .merr{margin-top:2px}
.btn[disabled]{opacity:.45;cursor:default}
.mavrow{padding:16px 0}
.card{width:264px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:var(--m-canvas);color:var(--m-ink);box-shadow:var(--m-shadow)}
.card .n{font-size:17px;font-weight:600;line-height:22px}
.card .h{font-size:15px;line-height:20px;color:var(--m-400);font-variant-numeric:tabular-nums}

/* ---------- iOS: X-style "Edit profile" screen ---------- */
.phone{position:relative;width:413px;height:872px;border-radius:58px;border:10px solid var(--i-bezel);background:var(--i-page);color:var(--i-label);box-shadow:var(--i-shadow);overflow:hidden;flex:none;font-size:17px;letter-spacing:-.41px}
.sbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 32px 0 44px;font-weight:600;font-size:17px;color:var(--i-label)}
.sbar .gl{display:flex;gap:6px;align-items:center}
.inav{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px}
.inav .t{font-weight:600}
.inav .l{justify-self:start}
.inav .act{justify-self:end;font-weight:600;color:var(--i-label);opacity:.35;cursor:default}
.inav .act.on{opacity:1;color:var(--i-accent);cursor:pointer}
.phone{display:flex;flex-direction:column}
.iscroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:34px}
.iscroll::-webkit-scrollbar{display:none}
.banner{position:relative;height:120px;background:linear-gradient(160deg,var(--i-banner-a),var(--i-banner-b));border-bottom:.5px solid var(--i-banner-edge)}
.ihead{position:relative;height:60px}
.iav{position:absolute;left:16px;top:-44px;width:88px;height:88px;padding:4px;border-radius:50%;background:var(--i-page)}
.iav .av{width:80px;height:80px;font-size:30px;color:transparent;background:linear-gradient(140deg,var(--i-av-a),var(--i-av-b))}
.cam{position:absolute;inset:4px;border-radius:50%;background:var(--i-cam);color:var(--i-cam-ink);display:grid;place-items:center;cursor:pointer}
.itable{border-top:.5px solid var(--i-hair)}
.ir{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:center;min-height:52px;padding:0 16px;border-bottom:.5px solid var(--i-hair);font-size:15px;line-height:20px;letter-spacing:-.23px}
.ir .k{font-weight:600;color:var(--i-label)}
.ir .v{min-width:0;color:var(--i-accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ir .v.ro{color:var(--i-secondary)}
.ir .at{color:var(--i-secondary)}
.ir .phd,.ir .v.phd{color:var(--i-tertiary)}
.ir .v.wrap{white-space:normal}
.ir .chev{color:var(--i-tertiary);display:grid;place-items:center;margin-left:8px}
.ir .chev:hover{color:var(--i-accent)}
.ir.bad .v .val{color:var(--i-red)}
.itable .ir:last-child{border-bottom:0}
.ir.tall{align-items:start;padding-top:16px;padding-bottom:12px}
.icap{grid-column:2/4;margin-top:4px;font-size:13px;line-height:18px;letter-spacing:-.08px;color:var(--i-red)}
.ir .cp{color:var(--i-secondary);display:grid;place-items:center;margin-left:8px}
.icaret{display:inline-block;width:2px;height:19px;background:var(--i-accent);vertical-align:-4px;margin-left:1px;border-radius:1px}
.signout{margin-top:24px;min-height:52px;display:flex;align-items:center;padding:0 16px;border-top:.5px solid var(--i-hair);border-bottom:.5px solid var(--i-hair);font-size:15px;letter-spacing:-.23px;color:var(--i-red)}
.note{max-width:900px;padding:0 20px 32px;font-size:13px;line-height:1.5;color:var(--chrome-muted)}
@media (max-width:640px){.bar{padding:10px 16px}.stage{padding:16px}}
</style>
</head>
<body>
<div class="bar" id="bar">
  <strong>Custom Kordi ID</strong>
  <label>Device<span class="seg" data-key="device"><button data-v="mac">Mac</button><button data-v="ios">iPhone</button></span></label>
  <label>Theme<span class="seg" data-key="theme"><button data-v="light">Light</button><button data-v="dark">Dark</button></span></label>
  <label>Variant<span class="seg" data-key="variant"><button data-v="a">A</button><button data-v="b">B</button></span></label>
  <label>State<span class="seg" data-key="state"><button data-v="empty">Empty</button><button data-v="typing">Typing</button><button data-v="invalid">Invalid</button><button data-v="taken">Taken</button><button data-v="saved">Saved</button></span></label>
</div>
<div class="stage" id="stage"></div>
<p class="note" id="note"></p>
<script>
const NUMBER="175791355",NAME="Maya",EMAIL="maya@example.com";
const STATES={
  empty:{value:"",saved:""},
  typing:{value:"shuyhere",saved:""},
  invalid:{value:"shu_yhere",saved:"",error:"Use 3-30 letters and numbers, with at least one letter."},
  taken:{value:"maya",saved:"",error:"That Kordi ID is already taken."},
  saved:{value:"shuyhere",saved:"shuyhere"}
};
const VALID=/^(?=.*[A-Za-z])[A-Za-z0-9]{3,30}$/;
const DEFAULTS={device:"mac",theme:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light",variant:"a",state:"empty"};
const ALLOWED={device:["mac","ios"],theme:["light","dark"],variant:["a","b"],state:Object.keys(STATES)};
const params=new URLSearchParams(location.search),state={};
for(const k in DEFAULTS){const v=params.get(k);state[k]=ALLOWED[k].includes(v)?v:DEFAULTS[k];}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const svg=(d,s=16,w=1.7)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I={
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
  laptop:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>',
  bell:'<path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 21h4"/>',
  plug:'<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 01-12 0zM12 18v4"/>',
  brain:'<path d="M12 5a3 3 0 00-5.6 1.5A3 3 0 004 11a3 3 0 001.5 5A3.5 3.5 0 0012 18zM12 5a3 3 0 015.6 1.5A3 3 0 0120 11a3 3 0 01-1.5 5A3.5 3.5 0 0112 18zM12 5v15"/>',
  palette:'<circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16" cy="10" r="1"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  person:'<circle cx="12" cy="8" r="3.6"/><path d="M5 20.5c0-3.8 3.1-6.5 7-6.5s7 2.7 7 6.5"/>',
  at:'<circle cx="12" cy="12" r="3.6"/><path d="M15.6 9v4.2a2.4 2.4 0 004.8 0V12a8.4 8.4 0 10-3.3 6.7"/>',
  number:'<path d="M9.5 3.5L7.5 20.5M16.5 3.5l-2 17M4 9h16.5M3.5 15H20"/>',
  envelope:'<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  dice:'<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r=".8" fill="currentColor"/><circle cx="15" cy="15" r=".8" fill="currentColor"/><circle cx="15" cy="9" r=".8" fill="currentColor"/><circle cx="9" cy="15" r=".8" fill="currentColor"/>',
  camera:'<path d="M4 8.5A1.5 1.5 0 015.5 7h2.2l1.5-2h5.6l1.5 2h2.2A1.5 1.5 0 0120 8.5v9a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 17.5z"/><circle cx="12" cy="13" r="3.4"/>',
  chevdown:'<path d="M6 9l6 6 6-6"/>',
  photo:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/>',
  bang:'<circle cx="12" cy="12" r="9" fill="currentColor" stroke="none"/><path d="M12 7.5v5.5M12 16.2v.1" stroke="#fff" stroke-width="2.2"/>'
};
function model(){
  const s=STATES[state.state];
  const savedId=s.saved||NUMBER;
  const live=state.state==="typing"&&VALID.test(s.value);
  return {...s,effective:"@"+savedId,header:"@"+(live?s.value:savedId),live,focus:["typing","invalid","taken"].includes(state.state)};
}
function avatar(size,font){return `<div class="av" style="width:${size}px;height:${size}px;font-size:${font}px" aria-hidden="true">M</div>`;}
function mac(){
  const m=model(),b=state.variant==="b";
  const dirty=["typing","invalid","taken"].includes(state.state);
  const nav=(g,items)=>`<div class="ngroup"><div class="nlabel">${g}</div>${items.map(([ic,l,on])=>`<div class="nitem${on?" on":""}">${svg(I[ic])}<span>${l}</span></div>`).join("")}</div>`;
  const row=(t,v,d)=>`<div class="row"><div class="rt"><b>${t}</b>${d?`<span>${d}</span>`:""}</div>${v}</div>`;
  const chev=`<span class="chev">${svg(I.chevdown,13,2)}</span>`;
  const mr=(k,v,cls="",extra="")=>`<div class="mr${cls}"><b>${k}</b><div style="min-width:0"><div class="mv${extra}">${v}</div></div></div>`;
  const caret=m.focus?'<span class="caret"></span>':"";
  const idVal=m.value?`<span class="${m.error?"bad":""}">${esc(m.value)}</span>${caret}`:`${caret}<span class="ph">${NUMBER}</span>`;
  const idRow=`<div class="mr"><b>Kordi ID</b><div style="min-width:0"><div class="mv${m.focus?" focus":""}" role="textbox" aria-label="Kordi ID" aria-invalid="${!!m.error}"><span class="pre">@</span>${idVal}</div>${m.error?`<div class="merr" role="alert">${m.error}</div>`:""}</div></div>`;
  return `<div><div class="cap">Account settings · Profile</div>
  <div class="dlg" role="dialog" aria-label="Account settings">
    <div class="rail">
      <div class="search">${svg(I.search,14)}<span>Search</span></div>
      ${nav("Account",[["user","Profile",1],["laptop","Active sessions"]])}
      ${nav("Settings",[["key","Authentication"],["bell","Notifications"],["plug","Connectors"],["brain","Memory"],["palette","Appearance"]])}
    </div>
    <div class="mpage">
      <div class="mhead"><span class="xbtn">${svg(I.x)}</span></div>
      <div class="mbody"><div class="section">
        <h2>Profile</h2>
        <div class="mavrow">${avatar(64,26)}</div>
        ${mr("Name",NAME)}
        ${idRow}
        ${mr("About","Design and research at a small studio. Weekend climber."," top")}
        ${mr("Location","Lisbon")}
        ${mr("Time zone",`Western European Time, GMT+0${chev}`)}
        ${mr("Website",'<span class="ph">Add your website</span>')}
        ${mr("Birthday",`03/04/1996${chev}`)}
        ${mr("Email",EMAIL,""," ro")}
        ${b?mr("Account number","@"+NUMBER,""," ro"):""}
        <div class="rows" style="margin-top:24px">
          ${row("Save changes",`<button class="btn"${dirty?" data-save":" disabled"}>Save</button>`)}
        </div>
        <h2 style="padding-top:36px">Session</h2>
        <div class="rows">${row("Sign out",'<button class="btn" style="background:transparent;color:var(--m-error);border:1px solid var(--m-danger)">Sign out</button>',"Sign out of Kordi on this Mac.")}</div>
      </div></div>
    </div>
  </div></div>
  <div><div class="cap">Profile card (saved values)</div>
  <div class="card">${avatar(44,18)}<div><div class="n">${NAME}</div><div class="h">${m.effective}</div></div></div></div>`;
}
function ios(){
  const m=model(),b=state.variant==="b";
  const caret=m.focus?'<span class="icaret"></span>':"";
  const idVal=m.value?`<span class="val">${esc(m.value)}</span>${caret}`:`${caret}<span class="phd">${NUMBER}</span>`;
  const dirty=["typing","invalid","taken"].includes(state.state),done=state.state==="saved";
  const action=done?`<span class="act on">Done</span>`:`<span class="act${dirty?" on":""}"${dirty?" data-save":""} role="button" aria-disabled="${!dirty}">Save</span>`;
  const row=(k,v,extra="",cls="")=>`<div class="ir${cls}"><span class="k">${k}</span>${v}${extra}</div>`;
  const chev=`<span class="chev">${svg(I.chevdown,13,2)}</span>`;
  const err=m.error?`<div class="icap" role="alert">${m.error}</div>`:"";
  return `<div><div class="cap">Edit profile · 393pt</div>
  <div class="phone">
    <div class="sbar"><span>9:41</span><span class="gl"><svg width="18" height="11" viewBox="0 0 18 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="6" rx="1"/><rect x="10" y="2.5" width="3" height="8.5" rx="1"/><rect x="15" y="0" width="3" height="11" rx="1"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="1.6" fill="currentColor"/><rect x="24" y="4" width="1.5" height="4" rx=".7" fill="currentColor" opacity=".4"/></svg></span></div>
    <div class="inav"><span class="l">Cancel</span><span class="t">Edit profile</span>${action}</div>
    <div class="iscroll"><div class="banner" aria-hidden="true"></div>
    <div class="ihead">
      <div class="iav">${avatar(80,30)}<span class="cam" role="button" aria-label="Upload photo">${svg(I.camera,22,1.7)}</span></div>
    </div>
    <div class="itable">
      ${row("Name",`<span class="v">${NAME}</span>`)}
      <div class="ir${m.error?" bad tall":""}"><span class="k">Kordi ID</span><span class="v"><span class="at">@</span>${idVal}</span>${err}</div>
      ${row("About",`<span class="v wrap">Design and research at a small studio. Weekend climber.</span>`,"",' tall')}
      ${row("Location",`<span class="v">Lisbon</span>`,chev)}
      ${row("Time zone",`<span class="v">Western European Time, GMT+0</span>`,chev)}
      ${row("Website",`<span class="v phd">Add your website</span>`)}
      ${row("Birthday",`<span class="v">March 4, 1996</span>`,chev)}
      ${row("Email",`<span class="v ro">${EMAIL}</span>`)}
      ${b?row("Account number",`<span class="v ro">@${NUMBER}</span>`,`<span class="cp">${svg(I.copy,15,1.7)}</span>`):""}
    </div>
    <div class="signout" role="button">Sign out</div></div>
  </div></div>`;
}
const NOTES={
  a:"Variant A (recommended): the Kordi ID is edited under the display name. On Mac the read-only Kordi ID row goes away; on iPhone the Account row keeps the copy action and shows the effective ID, the chosen one or the number.",
  b:"Variant B: same field, and the number stays visible as a read-only “Account number” row on both platforms, so it can still be shared after a Kordi ID is chosen."
};
function render(){
  document.documentElement.dataset.theme=state.theme;
  document.getElementById("stage").innerHTML=state.device==="mac"?mac():ios();
  document.getElementById("note").textContent=NOTES[state.variant];
  document.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(state[seg.dataset.key]===b.dataset.v))));
  const q=new URLSearchParams(state).toString();
  if(location.search.slice(1)!==q)history.replaceState(null,"","?"+q);
}
document.getElementById("bar").addEventListener("click",e=>{
  const b=e.target.closest("button[data-v]");if(!b)return;
  state[b.parentElement.dataset.key]=b.dataset.v;render();
});
document.getElementById("stage").addEventListener("click",e=>{
  if(e.target.closest("[data-save]")&&state.state==="typing"){state.state="saved";render();}
});
render();
</script>
</body>
</html>
