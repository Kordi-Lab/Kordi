apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: kordi-cloud
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: kordi-cloud
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.14.3-alpine
          args: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
          ports:
            - containerPort: 4222
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nats-init
  namespace: kordi-cloud
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: natsio/nats-box:0.19.7
          command: ["/bin/sh", "-ec"]
          args:
            - |
              nats --server nats://nats:4222 stream info KORDI_EVENTS >/dev/null 2>&1 ||
                nats --server nats://nats:4222 stream add KORDI_EVENTS --subjects 'kordi.events.>' \
                  --storage file --retention limits --discard old --defaults
