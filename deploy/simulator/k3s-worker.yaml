# Template only. Substitute all dollar-braced placeholders before applying it.
apiVersion: batch/v1
kind: Job
metadata:
  name: "${SIMULATOR_JOB_NAME}"
  namespace: "${SIMULATOR_NAMESPACE}"
  labels:
    app.kubernetes.io/name: human-simulator-worker
    app.kubernetes.io/instance: "${SIMULATOR_JOB_NAME}"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: human-simulator-worker
        app.kubernetes.io/instance: "${SIMULATOR_JOB_NAME}"
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "${SIMULATOR_IMAGE}"
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --actor
            - "${SIMULATOR_ACTOR_ID}"
          env:
            - name: KORDI_SIMULATOR_API_BASE
              value: https://simulator.kordi.cloud
            - name: KORDI_SIM_ACTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "${SIMULATOR_WORKER_SECRET}"
                  key: KORDI_SIM_ACTOR_TOKEN
            # Use either this account session token or the email/password pair
            # below. These belong to the dedicated synthetic account only.
            - name: KORDI_SIM_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "${SIMULATOR_ACCOUNT_SECRET}"
                  key: KORDI_SIM_ACCOUNT_TOKEN
                  optional: true
            # To use login instead of a session token, provide these two keys
            # in the account Secret and uncomment both environment entries.
            # - name: KORDI_SIM_ACCOUNT_EMAIL
            #   valueFrom:
            #     secretKeyRef:
            #       name: ${SIMULATOR_ACCOUNT_SECRET}
            #       key: KORDI_SIM_ACCOUNT_EMAIL
            # - name: KORDI_SIM_ACCOUNT_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: ${SIMULATOR_ACCOUNT_SECRET}
            #       key: KORDI_SIM_ACCOUNT_PASSWORD
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
