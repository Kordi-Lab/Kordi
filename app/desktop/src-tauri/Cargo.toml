[package]
name = "kordi-desktop"
version = "0.0.1-beta.13"
description = "Kordi macOS desktop application"
authors = ["Kordi contributors"]
edition = "2021"

[lib]
name = "kordi_desktop_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kordi-core.workspace = true
kordi-cli = { path = "../../../agent/crates/cli", default-features = false, features = ["desktop-runtime"] }
kordi-session = { path = "../../../agent/crates/session" }
kordi-tools = { path = "../../../agent/crates/tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-updater = "2"
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
rusqlite = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
futures-util = "0.3"
hex = "0.4"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
tauri-plugin-notification = "2.3.3"
notify-rust = "4.18.0"

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.7"

[dev-dependencies]
# The Tauri updater uses reqwest 0.13 while the rest of the native runtime uses
# the workspace's reqwest 0.12. Keep the proxy integration test covering both.
reqwest-updater-stack = { package = "reqwest", version = "0.13", default-features = false, features = ["blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
