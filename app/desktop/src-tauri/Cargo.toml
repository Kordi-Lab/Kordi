[package]
name = "kordi-desktop"
version = "0.1.0"
description = "Kordi macOS desktop application"
authors = ["shuyang"]
edition = "2021"

[lib]
name = "kordi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

