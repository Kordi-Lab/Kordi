<script type="module">

  ...Array.from({length: 18},(_,index) => ({id: `history-${index}`,role: index%2 ? 'assistant' : 'user',senderAccountId: 'peer',text: index%2 ? 'The source comparison is kept in this session.' : 'Compare the planetary data.',timestampMs: index*1000})),

  {id:'queued',role:'user',text:'@KordiAlex summarize afterward',senderAccountId:'peer',timestampMs:20000,requestState:'queued'},

  {id:'owner-queued',role:'user',text:'Owner queued follow',senderAccountId:'owner',senderDisplayName:'Alex',timestampMs:21000,requestState:'queued'}
]};

window.unexpectedNativePrefetches = 0;
window.fetch = async (url,init) => {
  if (String(url).includes('/v2/chat/sync/bootstrap')) return new Response(JSON.stringify({protocol_version:2,
    conversations:[{id:'20000000-0000-4000-8000-000000000001',kind:'group',shared_title:'Research group',version:1,
      created_by_account_id:'owner',legacy_session_id:'session:group:fixture-parent',latest_message_sequence:100,
      members:[],preferences:{account_id:window.fixtureAccountId??'peer',conversation_id:'20000000-0000-4000-8000-000000000001',personal_title:null,version:1}}],
    latest_messages:[],next_cursor:'fixture',last_stream_seq:1,server_time:'2026-09-06T00:00:00Z'}));
  if (String(url).includes('/threads/read')) return new Response(JSON.stringify(await window.fixtureThreadReadRequest({
    accountId:window.fixtureAccountId??'peer',method:init?.method??'GET',body:init?.body?JSON.parse(init.body):null})));
  if (String(url).includes('/agent-subsessions?')) {
    const after = new URL(String(url)).searchParams.get('after');
    return new Response(JSON.stringify({sessions:after?window.fixtureAgentTasks.slice(1):window.fixtureAgentTasks.slice(0,1),nextCursor:after?null:'fixture-next-page'}), {headers:{'content-type':'application/json'}});
  }
  if (!String(url).includes('/agent-subsessions/')) throw Error('Unexpected fixture request');
  if (init?.method === 'POST') {
    const message = JSON.parse(init.body);
    window.sentSubsessionRequests.push(message);
    if (window.failNextSubsessionSend) {
      window.failNextSubsessionSend = false;
      return new Response('Unavailable', {status:503});
    }
    snapshot.messages.push({ id:message.clientMessageId,role:'user',text:message.text,senderAccountId:'peer',
      timestampMs:Date.now(),mentions:message.mentions,requestState:message.mentions.some(m=>m.agentId==='fixture-agent')?(snapshot.status==='running'?'queued':'pending'):null });
    snapshot.version += 1;
  }
  return new Response(JSON.stringify(snapshot),{headers:{'content-type':'application/json'}});
};
const noop=()=>{};
const parent={ id:'fixture-parent',canonicalSessionId:'session:group:fixture-parent',name:'Research group',type:'person',
  subtitle:'Group chat',unread:0,collaborationSources:['Cloud'],trust:'Shared',directness:'Group chat',participants:['Sam','Alex'],
  messages:[{id:'parent-response',role:'external-agent',sender:"Alex's Kordi",text:'Parent conversation remains here.',time:'08:00',
    turn:{id:'parent-turn',sessionId:'fixture-parent',prompt:'Research',status:'succeeded',message:'',assistantText:'Parent conversation remains here.',
      thinkingText:'',completed:true,succeeded:true,tools:[{id:'spawn',name:'task_operator',status:'completed',arguments:'{"action":"spawn"}',
        liveOutput:'',isError:false,resultText:'Background session: {"sessionId":"fixture-child","title":"Planet research","status":"running"}'}]}}]};
if (window.fixtureDiscussionRole) {
  parent.directness = window.fixtureDiscussionContext === 'contact' ? 'Direct chat' : 'Group chat';
  const root = parent.messages[0];
  root.role = window.fixtureDiscussionRole;
  root.replyAliasIds = ['cloud-response'];
  root.reactionTargetMessageId = '10000000-0000-4000-8000-000000000001';
  root.turn.tools = [];
  parent.messages.push(...[1,2,3].map(index => ({id:`discussion-${index}`,role:'person',sender:'Sam',senderType:'human',
    text:`Discussion reply ${index}`,time:'08:01',conversationSequence:index+1,messageAction:{schemaVersion:1,kind:'thread',source:{sourceSessionId:parent.canonicalSessionId,
      sourceMessageId:index===1?'collaboration-message:another-viewer:10000000-0000-4000-8000-000000000001':index===2?'cloud-response':'10000000-0000-4000-8000-000000000001',
      senderLabel:root.sender,textPreview:root.text,attachmentCount:0}}})));
}
const props={
  cloudAccount:window.fixtureThreadUnread?{accountId:window.fixtureAccountId??'peer',displayName:'Sam'}:null,
  isNativeShell:false,showChatDetailRail:false,collapseChatSessions:false,setIsSessionPanelCollapsed:noop,
  showRightDetailRail:false,isDetailPanelCollapsed:true,setIsDetailPanelCollapsed:noop,activeConv:parent,
  chatConversations:[parent],companionConversations:[parent],activeConversationUsesCollaboration:false,
  activeCollaborationModelHost:null,desktopChatState:null,onUpdateCollaborationAgentModelRouting:async()=>{},

  onRenameDesktopSession:async()=>{},onRenameChatSession:async()=>{},chatTranscriptScrollRef:{current:null},onTranscriptScroll:noop,
  onOpenSource:noop,onOpenArtifact:noop,desktopLiveTurn:null,queuedDesktopMessages:[],queuedDesktopMessagesBySession:{},

  chatAttachmentInputRef:{current:null},chatComposerAttachments:[],saveDesktopAttachments:async()=>[],saveDesktopAttachmentPaths:async()=>[],
  removeChatComposerAttachment:noop,updateChatComposerAttachment:noop,chatComposerText:'',updateChatComposerDraft:noop,
  setChatComposerText:noop,setChatComposerTextForSession:noop,composerControlsRef:{current:null},activeRuntimeContextStatus:null,activeRuntimeCacheText:null,
  composerSelection:{mode:'Send as Me',model:'Test model',thinking:'medium'},openComposerSelector:null,toggleComposerSelector:noop,
  selectComposerValue:noop,composerAuthLabel:'Connected',composerAuthOptions:[],selectComposerAuthChoice:noop,selectComposerProviderChoice:noop,
  composerProviderOptions:[],chatModelOptions:[],isDesktopChatSending:false,onStopDesktopChatTurn:noop,onStopCollaborationAgentRequest:noop,
  onRequestCollaborationContact:noop,onForkChatMessage:async()=>{},onSelectSession:noop,
  onSendChatMessage:()=>{window.unexpectedParentSends+=1;},onPrefetchChatSession:async()=>{window.unexpectedNativePrefetches+=1;return false;},
  hasAnyAuth:true,onOpenAuthSettings:noop,onOpenAccountAuthentication:noop
};
const privateChat = {id:'private-session',name:'Private workspace',type:'owned-agent',subtitle:'',unread:0,
  collaborationSources:['Local'],trust:'Owned',directness:'Agent chat',participants:['Sam'],
  messages:[{id:'private-history',role:'owned-agent',text:'PRIVATE_HISTORY_CANARY',time:'08:00'}]};
props.chatConversations = props.companionConversations = [parent,
  {...privateChat,id:'external-session',name:'Other owner session',type:'external-agent'},
  {...privateChat,id:'shared-session',name:'Shared Agent session',trust:'Shared'},privateChat];
props.onSendChatMessage = (text,id,context,attachments,quote) => {
  if (id === privateChat.id) window.privateSends.push({text,id,context});
  else if (quote?.action === 'thread') window.threadSends.push({text,quote});
  else window.unexpectedParentSends += 1;
};
props.rightDetailRail = React.createElement(TaskActivityDashboardPanel, {
  messages:parent.messages,currentSessionId:parent.id,agentThreadParentId:parent.id,
  emptyMessage:'No tasks',taskActivities:[{id:'legacy',sourceRequestId:'old-task',status:'active',createdAtMs:1,
    initiator:{id:'owner',name:'Alex'},target:{name:'Legacy task'},participants:[]}],
});
function Fixture() {
  const [collapsed,setCollapsed] = React.useState(true);
  const [tab,setTab] = React.useState('info');
  const [created,setCreated] = React.useState([]);
  const [mainDraft,setMainDraft] = React.useState('');
  const createActions = useKordiSideAgentSessionActions({isNativeShell:true,setDesktopChatError:noop,setComposerDrafts:noop,
    setDesktopChatState:state=>{
      const entry={...privateChat,id:state.activeSessionId,canonicalSessionId:state.activeSessionId,name:'New chat',messages:[],

  const conversations=collapseBlankConversationShells([...props.chatConversations,...created]);

    onPrefetchChatSession:async(id)=>{if(id.startsWith('new-private-')) return true; window.unexpectedNativePrefetches+=1;return false;},
