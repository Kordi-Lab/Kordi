<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kordi · Neutral material preview</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; height: 100dvh; display: grid; grid-template-rows: 42px minmax(0,1fr); font: 12px system-ui, sans-serif; color: #333; background: #fff; }
header { display: flex; align-items: center; gap: 18px; padding: 0 16px; border-bottom: 1px solid #ddd; }
label { display: flex; align-items: center; gap: 8px; }
input { width: 30px; height: 24px; padding: 0; border: 1px solid #ccc; background: none; cursor: pointer; }
span { color: #666; }
iframe { border: 0; width: 100%; height: 100%; min-height: 0; }
</style>
</head>
<body>
<header><strong>Synthetic preview</strong><label>Backdrop <input id="backdrop" type="color" value="#dadada" aria-label="Preview backdrop color"></label><span>White layers: continuous outer surface 28% · sidebar +67% · content 100%</span></header>
<iframe id="preview" src="./compactShell.html" title="Complete Kordi Classic application with synthetic data"></iframe>
<script>
const backdrop = document.querySelector('#backdrop');
const preview = document.querySelector('#preview');
const update = () => preview.contentWindow.postMessage({ previewBackdrop: backdrop.value }, location.origin);
backdrop.addEventListener('input', update);
preview.addEventListener('load', update);
</script>
</body>
</html>
