name: Kordi
options:
  minimumXcodeGenVersion: 2.46.0
  defaultConfig: Debug
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Beta: debug
  Debug: debug
  Release: release
packages:
  EmojiKit:
    url: https://github.com/danielsaidi/EmojiKit.git
    exactVersion: 2.5.0
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: 2.16.0
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: NO
    MARKETING_VERSION: 0.0.1
    CURRENT_PROJECT_VERSION: 36
    CODE_SIGN_STYLE: Automatic
targets:
  Kordi:
    type: application
    platform: iOS
    sources:
      - path: Kordi
        excludes:
          - Supporting/Preview Content
    resources:
      - path: Kordi/Resources/Assets.xcassets
      - path: Kordi/Supporting/Preview Content
        optional: true
    entitlements:
      path: Kordi/Supporting/Kordi.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
    info:
      path: Kordi/Supporting/Info.plist
      properties:
        CFBundleDisplayName: $(KORDI_APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Kordi uses the camera when you choose to share video in a call or attach a new photo to a message.
        NSLocalNetworkUsageDescription: Kordi uses the local network to establish audio and video calls when required.
        NSMicrophoneUsageDescription: Kordi uses the microphone when you join an audio or video call.
        NSPhotoLibraryUsageDescription: Kordi shows your photo library when you choose images to send in a conversation.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).oauth
            CFBundleURLSchemes:
              - $(KORDI_OAUTH_CALLBACK_SCHEME)
        KordiCloudBaseURL: $(KORDI_CLOUD_BASE_URL)
        KordiDistributionChannel: $(KORDI_DISTRIBUTION_CHANNEL)
        KordiOAuthCallbackScheme: $(KORDI_OAUTH_CALLBACK_SCHEME)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
          - remote-notification
          - voip
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Kordi/Supporting/Info.plist
      configs:
        Beta:
          PRODUCT_BUNDLE_IDENTIFIER: ai.kordi.ios.beta
          PRODUCT_NAME: Kordi
          KORDI_APP_DISPLAY_NAME: Kordi Beta
          KORDI_CLOUD_BASE_URL: http://127.0.0.1:17081
          KORDI_DISTRIBUTION_CHANNEL: beta
          KORDI_OAUTH_CALLBACK_SCHEME: kordi-beta
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconBeta
          APNS_ENVIRONMENT: development
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG BETA
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ai.kordi.ios
          PRODUCT_NAME: Kordi
          KORDI_APP_DISPLAY_NAME: Kordi
          KORDI_CLOUD_BASE_URL: https://kordi.ai
          KORDI_DISTRIBUTION_CHANNEL: production
          KORDI_OAUTH_CALLBACK_SCHEME: kordi
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          APNS_ENVIRONMENT: development
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: ai.kordi.ios
          PRODUCT_NAME: Kordi
          KORDI_APP_DISPLAY_NAME: Kordi
          KORDI_CLOUD_BASE_URL: https://kordi.ai
          KORDI_DISTRIBUTION_CHANNEL: production
          KORDI_OAUTH_CALLBACK_SCHEME: kordi
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          APNS_ENVIRONMENT: production
    dependencies:
      - package: EmojiKit
      - package: LiveKit
  KordiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KordiTests
    dependencies:
      - target: Kordi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Beta:
          PRODUCT_BUNDLE_IDENTIFIER: ai.kordi.ios.beta.tests
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ai.kordi.ios.tests
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: ai.kordi.ios.tests
schemes:
  Kordi:
    build:
      targets:
        Kordi: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - KordiTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Kordi Beta:
    build:
      targets:
        Kordi: all
    run:
      config: Beta
    test:
      config: Beta
      gatherCoverageData: true
      targets:
        - KordiTests
    profile:
      config: Beta
    analyze:
      config: Beta
    archive:
      config: Beta
