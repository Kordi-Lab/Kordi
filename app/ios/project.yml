name: Kordi
options:
  minimumXcodeGenVersion: 2.46.0
  defaultConfig: Debug
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Beta: debug
  Debug: debug
  Release: release
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: 2.16.0
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: NO
    MARKETING_VERSION: 0.0.1
    CURRENT_PROJECT_VERSION: 43
    CODE_SIGN_STYLE: Automatic
targets:
  Kordi:
    type: application
    platform: iOS
    sources:
      - path: Kordi
        excludes:
          - Supporting/Preview Content
          - Resources/blob-emoji
          - Resources/noto-emoji
      - path: Kordi/Resources/blob-emoji
        type: folder
      - path: Kordi/Resources/noto-emoji
        type: folder
      - path: ../../shared/digest
        type: folder
        createIntermediateGroups: false
        buildPhase: resources
    resources:
      - path: Kordi/Resources/Assets.xcassets
      - path: Kordi/Supporting/Preview Content
        optional: true
    entitlements:
      path: Kordi/Supporting/Kordi.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
        com.apple.security.application-groups:
          - $(KORDI_SHARE_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(KORDI_SHARE_CREDENTIAL_SERVICE)
    info:
      path: Kordi/Supporting/Info.plist
      properties:
        CFBundleDisplayName: $(KORDI_APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: Kordi reads calendar events for your private Digest. It does not send invitations or change events.
        NSCameraUsageDescription: Kordi uses the camera when you record a video message, attach a photo, or join a video call.
        NSLocalNetworkUsageDescription: Kordi uses the local network to establish audio and video calls when required.
        NSMicrophoneUsageDescription: Kordi uses the microphone when you record a voice or video message or join a call.
        NSSpeechRecognitionUsageDescription: Kordi transcribes voice messages on this iPhone so people and agents can read them.
        NSPhotoLibraryAddUsageDescription: Kordi saves Live Photos you choose to your photo library.
        NSPhotoLibraryUsageDescription: Kordi shows your photo library when you choose images to send in a conversation.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).oauth
            CFBundleURLSchemes:
              - $(KORDI_OAUTH_CALLBACK_SCHEME)
        KordiCloudBaseURL: $(KORDI_CLOUD_BASE_URL)
        KordiDistributionChannel: $(KORDI_DISTRIBUTION_CHANNEL)
        KordiOAuthCallbackScheme: $(KORDI_OAUTH_CALLBACK_SCHEME)
        KordiHostAppURLScheme: $(KORDI_OAUTH_CALLBACK_SCHEME)
        KordiShareAppGroup: $(KORDI_SHARE_APP_GROUP)
        KordiShareCredentialService: $(KORDI_SHARE_CREDENTIAL_SERVICE)
        KordiShareKeychainAccessGroup: $(AppIdentifierPrefix)$(KORDI_SHARE_CREDENTIAL_SERVICE)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIImageName: KordiLaunchMark
        UIBackgroundModes:
          - audio
          - remote-notification
          - voip
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Kordi/Supporting/Info.plist
      configs:
        Beta:
          PRODUCT_BUNDLE_IDENTIFIER: ai.kordi.ios.beta
          PRODUCT_NAME: Kordi
          KORDI_APP_DISPLAY_NAME: Kordi Beta
          KORDI_CLOUD_BASE_URL: http://127.0.0.1:17081
          KORDI_DISTRIBUTION_CHANNEL: beta
          KORDI_OAUTH_CALLBACK_SCHEME: kordi-beta
          KORDI_SHARE_APP_GROUP: group.ai.kordi.beta.share
          KORDI_SHARE_CREDENTIAL_SERVICE: ai.kordi.beta.share-session
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconBeta
          APNS_ENVIRONMENT: development
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG BETA
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ai.kordi.ios
          PRODUCT_NAME: Kordi
          KORDI_APP_DISPLAY_NAME: Kordi
          KORDI_CLOUD_BASE_URL: https://kordi.ai
          KORDI_DISTRIBUTION_CHANNEL: production
          KORDI_OAUTH_CALLBACK_SCHEME: kordi
          KORDI_SHARE_APP_GROUP: group.ai.kordi.share
          KORDI_SHARE_CREDENTIAL_SERVICE: ai.kordi.share-session
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          APNS_ENVIRONMENT: development
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: ai.kordi.ios
          PRODUCT_NAME: Kordi
          KORDI_APP_DISPLAY_NAME: Kordi
          KORDI_CLOUD_BASE_URL: https://kordi.ai
          KORDI_DISTRIBUTION_CHANNEL: production
          KORDI_OAUTH_CALLBACK_SCHEME: kordi
          KORDI_SHARE_APP_GROUP: group.ai.kordi.share
          KORDI_SHARE_CREDENTIAL_SERVICE: ai.kordi.share-session
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          APNS_ENVIRONMENT: production
    dependencies:
      - package: LiveKit
      - target: KordiShareExtension
        embed: true
  KordiShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: KordiShareExtension
      - path: Kordi/Core/Share/ShareExtensionSupport.swift
    entitlements:
      path: KordiShareExtension/Supporting/KordiShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(KORDI_SHARE_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(KORDI_SHARE_CREDENTIAL_SERVICE)
    info:
      path: KordiShareExtension/Supporting/Info.plist
      properties:
        CFBundleDisplayName: $(KORDI_SHARE_EXTENSION_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        KordiCloudBaseURL: $(KORDI_CLOUD_BASE_URL)
        KordiDistributionChannel: $(KORDI_DISTRIBUTION_CHANNEL)
        KordiHostAppURLScheme: $(KORDI_OAUTH_CALLBACK_SCHEME)
        KordiShareAppGroup: $(KORDI_SHARE_APP_GROUP)
        KordiShareCredentialService: $(KORDI_SHARE_CREDENTIAL_SERVICE)
        KordiShareKeychainAccessGroup: $(AppIdentifierPrefix)$(KORDI_SHARE_CREDENTIAL_SERVICE)
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: KordiShareExtension/Supporting/Info.plist
        PRODUCT_NAME: KordiShareExtension
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1
      configs:
        Beta:
          PRODUCT_BUNDLE_IDENTIFIER: ai.kordi.ios.beta.share
          KORDI_CLOUD_BASE_URL: http://127.0.0.1:17081
          KORDI_DISTRIBUTION_CHANNEL: beta
          KORDI_OAUTH_CALLBACK_SCHEME: kordi-beta
          KORDI_SHARE_APP_GROUP: group.ai.kordi.beta.share
          KORDI_SHARE_CREDENTIAL_SERVICE: ai.kordi.beta.share-session
          KORDI_SHARE_EXTENSION_DISPLAY_NAME: Kordi Beta
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG BETA
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ai.kordi.ios.share
          KORDI_CLOUD_BASE_URL: https://kordi.ai
          KORDI_DISTRIBUTION_CHANNEL: production
          KORDI_OAUTH_CALLBACK_SCHEME: kordi
          KORDI_SHARE_APP_GROUP: group.ai.kordi.share
          KORDI_SHARE_CREDENTIAL_SERVICE: ai.kordi.share-session
          KORDI_SHARE_EXTENSION_DISPLAY_NAME: Kordi
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: ai.kordi.ios.share
          KORDI_CLOUD_BASE_URL: https://kordi.ai
          KORDI_DISTRIBUTION_CHANNEL: production
          KORDI_OAUTH_CALLBACK_SCHEME: kordi
          KORDI_SHARE_APP_GROUP: group.ai.kordi.share
          KORDI_SHARE_CREDENTIAL_SERVICE: ai.kordi.share-session
          KORDI_SHARE_EXTENSION_DISPLAY_NAME: Kordi
  KordiTests:
    type: bundle.unit-test
    platform: iOS
    preBuildScripts:
      - name: Generate synthetic Live Photo test assets
        script: bash "$SRCROOT/../../scripts/prepare-live-photo-test-assets.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
        inputFiles:
          - $(SRCROOT)/../desktop/src-tauri/native/LivePhotos.swift
          - $(SRCROOT)/../desktop/tests/livePhotoNativeCheck.swift
          - $(SRCROOT)/../../scripts/prepare-live-photo-test-assets.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/live-photo.jpg
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/live-photo.mov
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/live-photo.mp4
    sources:
      - path: KordiTests
      - path: ../../shared/agent-targeting
        type: folder
        createIntermediateGroups: false
        buildPhase: resources
    dependencies:
      - target: Kordi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Beta:
          PRODUCT_BUNDLE_IDENTIFIER: ai.kordi.ios.beta.tests
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ai.kordi.ios.tests
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: ai.kordi.ios.tests
  KordiKeyboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KordiKeyboardUITests
    dependencies:
      - target: Kordi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.kordi.ios.beta.keyboard-uitests
        TEST_TARGET_NAME: Kordi
schemes:
  Kordi:
    build:
      targets:
        Kordi: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - KordiTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Kordi Beta:
    build:
      targets:
        Kordi: all
    run:
      config: Beta
    test:
      config: Beta
      gatherCoverageData: true
      targets:
        - KordiTests
    profile:
      config: Beta
    analyze:
      config: Beta
    archive:
      config: Beta
  Kordi Keyboard UI:
    build:
      targets:
        Kordi: all
    run:
      config: Beta
    test:
      config: Beta
      targets:
        - KordiKeyboardUITests
