[workspace]
resolver = "2"
members = [
    "agent/crates/core",
    "agent/crates/session",
    "agent/crates/tools",
    "agent/crates/provider",
    "agent/crates/hooks",
    "agent/crates/plugin-host",
    "agent/crates/tui",
    "agent/crates/cli",
    "agent/crates/kordi-monitor",
    "app/server",
    "app/desktop/src-tauri",
    "bridges/cli",
    "bridges/cloud-server",
    "shared/rust/protocol",
]

[workspace.package]
version = "0.0.18"
edition = "2024"
license = "MIT"
authors = ["Kordi Contributors"]
repository = "https://github.com/Kordi-AI/Kordi"
homepage = "https://github.com/Kordi-AI/Kordi"
readme = "README.md"

[workspace.dependencies]
# Shared deps across crates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.35", features = ["bundled", "serde_json"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures = "0.3"
tokio-util = "0.7"
similar = "2"
regex = "1"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# Internal crates
kordi-core = { version = "0.0.18", path = "agent/crates/core" }
kordi-session = { version = "0.0.18", path = "agent/crates/session" }
kordi-tools = { version = "0.0.18", path = "agent/crates/tools" }
kordi-provider = { version = "0.0.18", path = "agent/crates/provider" }
kordi-hooks = { version = "0.0.18", path = "agent/crates/hooks" }
kordi-plugin-host = { version = "0.0.18", path = "agent/crates/plugin-host" }
kordi-tui = { version = "0.0.18", path = "agent/crates/tui" }
kordi-monitor = { version = "0.0.18", path = "agent/crates/kordi-monitor" }
kordi-protocol = { version = "0.1.0", path = "shared/rust/protocol" }

[profile.release]
strip = "debuginfo"
