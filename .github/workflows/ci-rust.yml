name: CI rust

on:
  workflow_call:
    inputs:
      manifest:
        description: Expected-work manifest produced by the blocking CI changes job.
        required: true
        type: string
    outputs:
      results:
        description: Machine-readable completion results for the server and migrations groups.
        value: ${{ jobs.completion.outputs.results }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.applicable.outputs.server }}
      migrations: ${{ steps.applicable.outputs.migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Resolve applicability
        id: applicable
        shell: bash
        env:
          MANIFEST: ${{ inputs.manifest }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$MANIFEST" > "$RUNNER_TEMP/ci-manifest.json"
          node scripts/check-ci-results.mjs check-manifest \
            --manifest "$RUNNER_TEMP/ci-manifest.json" \
            --expected-revision "$EXPECTED_REVISION"
          for group in server migrations; do
            echo "$group=$(node scripts/check-ci-results.mjs applicable --manifest "$RUNNER_TEMP/ci-manifest.json" --group "$group")" >> "$GITHUB_OUTPUT"
          done

  server:
    name: Server and core checks
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 10.29.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7

      - name: Run server checks
        run: pnpm check:server

  migrations:
    name: Database migrations
    needs: plan
    if: needs.plan.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 10.29.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7

      - name: Run migration checks
        run: pnpm check:migrations

  completion:
    name: Complete rust results
    needs:
      - plan
      - server
      - migrations
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      results: ${{ steps.publish.outputs.results }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Emit completion result
        id: emit
        shell: bash
        env:
          MANIFEST: ${{ inputs.manifest }}
          SERVER_RESULT: ${{ needs.server.result }}
          MIGRATIONS_RESULT: ${{ needs.migrations.result }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '%s' "$MANIFEST" > "$RUNNER_TEMP/ci-manifest.json"
          node scripts/check-ci-results.mjs emit \
            --manifest "$RUNNER_TEMP/ci-manifest.json" \
            --result "server=$SERVER_RESULT" \
            --result "migrations=$MIGRATIONS_RESULT" \
            --sha "$REVISION" \
            --run-id "$RUN_ID" \
            --summary \
            --fail-on-invalid \
            --out "$RUNNER_TEMP/ci-results.json"

      - name: Publish completion result
        id: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/ci-results.json" ]; then
            {
              echo "results<<CI_RESULTS_EOF"
              cat "$RUNNER_TEMP/ci-results.json"
              echo "CI_RESULTS_EOF"
            } >> "$GITHUB_OUTPUT"
          fi
