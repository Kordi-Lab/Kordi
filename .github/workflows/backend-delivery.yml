name: Backend delivery

on:
  workflow_run:
    workflows: [Post-merge CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Tested main revision to rebuild (blank means current main)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build tested backend bundle
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Resolve and authorize the tested revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"
          sha="${REQUESTED_SHA:-$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" --jq .merge_base_commit.sha)" = "$sha"
          ready=false
          for attempt in $(seq 1 20); do
            if node scripts/check-sha-readiness.mjs --sha "$sha" --branch main --check 'CI required' --check 'Post-merge CI required'; then
              ready=true
              break
            fi
            sleep 15
          done
          test "$ready" = true
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout the tested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.revision.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build both backend images once
        env:
          TARGET_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          cd source
          bash ../scripts/build-backend-bundle.sh "$TARGET_SHA" "$RUNNER_TEMP/backend-bundle" "$GITHUB_RUN_ID"
      - name: Store the immutable promotion bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-bundle
          path: ${{ runner.temp }}/backend-bundle
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  development:
    name: Update shared development backend
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    concurrency:
      group: backend-shared-development
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_SHA: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Skip revisions superseded while building
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$TARGET_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main revision superseded this build; shared development was not changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.current.outputs.deploy == 'true'
        with:
          name: backend-bundle
          path: ${{ runner.temp }}/backend-bundle
      - name: Authenticate to isolated development
        if: steps.current.outputs.deploy == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ secrets.KORDI_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.KORDI_DEV_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        if: steps.current.outputs.deploy == 'true'
      - name: Deploy and verify on the development host
        if: steps.current.outputs.deploy == 'true'
        env:
          KORDI_BACKEND_PROJECT: ${{ secrets.KORDI_BACKEND_PROJECT }}
          KORDI_BACKEND_ZONE: ${{ secrets.KORDI_BACKEND_ZONE }}
          KORDI_BACKEND_TARGET: ${{ secrets.KORDI_BACKEND_TARGET }}
          KORDI_BACKEND_STATE: ${{ secrets.KORDI_BACKEND_STATE }}
          KORDI_BACKEND_ENV_FILE: ${{ secrets.KORDI_BACKEND_ENV_FILE }}
          KORDI_BACKEND_COMPOSE_PROJECT: ${{ secrets.KORDI_BACKEND_COMPOSE_PROJECT }}
        run: bash scripts/deploy-backend-bundle.sh dev "$RUNNER_TEMP/backend-bundle" "$TARGET_SHA" "$GITHUB_RUN_ID"
      - name: Publish deployment outcome
        if: always() && steps.current.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-deployment-result
          path: ${{ runner.temp }}/backend-bundle/deployment-result.json
          if-no-files-found: warn
          retention-days: 30
      - name: Link the production promotion
        if: success() && steps.current.outputs.deploy == 'true'
        run: |
          {
            echo "Development verified revision \`$TARGET_SHA\`."
            echo "Promote this exact bundle with build run ID \`$GITHUB_RUN_ID\` using Deploy production."
          } >> "$GITHUB_STEP_SUMMARY"
