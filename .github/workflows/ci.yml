name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Desktop frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit test desktop
        run: pnpm --dir app/desktop test:unit

      - name: Test repository scripts
        run: pnpm test:scripts

      - name: Typecheck desktop
        run: pnpm --dir app/desktop typecheck

      - name: Lint desktop
        run: pnpm --dir app/desktop lint

      - name: Build desktop web bundle
        run: pnpm --dir app/desktop build

  desktop-visual:
    name: Desktop visual regression
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install visual-test browser
        run: pnpm --dir app/desktop exec playwright install chromium

      - name: Compare transient surfaces
        run: pnpm --dir app/desktop test:visual

  rust:
    name: Rust checks
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Prepare Tauri sidecar placeholders
        run: bash scripts/prepare-tauri-sidecar-placeholders.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test session crate
        run: cargo test -p kordi-session

      - name: Test CLI lib
        run: cargo test -p kordi-cli --lib

      - name: Test desktop runtime
        run: cargo test -p kordi-cli desktop_runtime --no-default-features

      - name: Test desktop Tauri crate
        run: cargo test -p kordi-desktop --no-default-features

      - name: Test Cloud server
        run: cargo test -p kordi-cloud-server

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check whitespace in changed files
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            bash scripts/check-hygiene.sh "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            bash scripts/check-hygiene.sh "${{ github.event.before }}...${{ github.sha }}"
          else
            bash scripts/check-hygiene.sh HEAD
          fi

      - name: Prevent quality debt growth
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            comparison="${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            comparison="${{ github.event.before }}...${{ github.sha }}"
          else
            comparison="HEAD"
          fi
          node scripts/report-maintainability-audit.mjs --limit 20
          node scripts/check-maintainability-ratchet.mjs "$comparison"
          node scripts/check-eslint-suppressions-ratchet.mjs "$comparison"
