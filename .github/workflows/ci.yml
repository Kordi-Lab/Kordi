name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Desktop frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit test desktop
        run: pnpm --dir app/desktop test:unit

      - name: Test repository scripts
        run: pnpm test:scripts

      - name: Typecheck desktop
        run: pnpm --dir app/desktop typecheck

      - name: Lint desktop
        run: pnpm --dir app/desktop lint

      - name: Build desktop web bundle
        run: pnpm --dir app/desktop build

  desktop-visual:
    name: Desktop visual regression
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install visual-test browser
        run: pnpm --dir app/desktop exec playwright install chromium

      - name: Install ffmpeg for media fixtures
        run: |
          brew install ffmpeg
          which ffmpeg

      - name: Compare transient surfaces
        run: pnpm --dir app/desktop test:visual --project chromium

      - name: Verify production desktop and media entrypoints
        shell: bash
        run: |
          set -euo pipefail
          export KORDI_PRODUCTION_TEST_PORT="$(node -e 'const s=require("net").createServer();s.listen(0,"127.0.0.1",()=>{process.stdout.write(String(s.address().port));s.close()})')"
          pnpm --dir app/desktop exec playwright test -c playwright.production.config.ts --project chromium

      - name: Verify minified transcript trajectories
        shell: bash
        run: |
          set -euo pipefail
          export KORDI_TRAJECTORY_TEST_PORT="$(node -e 'const s=require("net").createServer();s.listen(0,"127.0.0.1",()=>{process.stdout.write(String(s.address().port));s.close()})')"
          pnpm --dir app/desktop exec playwright test -c playwright.trajectory.config.ts --project chromium

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy portable crates
        run: cargo clippy --workspace --exclude kordi-desktop --all-targets -- -D warnings

      - name: Test session crate
        run: cargo test -p kordi-session

      - name: Test provider request contracts
        run: cargo test -p kordi-provider --locked

      - name: Test local image reading
        run: cargo test -p kordi-tools read::tests --locked

      - name: Test cloud agent runner
        # Existing runtime-selection tests modify process environment variables.
        run: cargo test -p kordi-cloud-agent-runner --locked -- --test-threads=1

      - name: Test CLI lib
        run: cargo test -p kordi-cli --lib

      - name: Test desktop runtime
        run: cargo test -p kordi-cli desktop_runtime --no-default-features

      - name: Test Cloud server
        run: cargo test -p kordi-cloud-server

      - name: Prepare pinned PostgreSQL 16.14 test container
        run: docker pull postgres:16.14-alpine

      - name: Test database upgrade compatibility
        run: bash scripts/test-cloud-migrations.sh

  rust-desktop:
    name: Rust desktop checks (macOS)
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Prepare Tauri sidecar placeholders
        run: bash scripts/prepare-tauri-sidecar-placeholders.sh

      - name: Clippy desktop crate
        run: cargo clippy -p kordi-desktop --all-targets -- -D warnings

      - name: Test desktop Tauri crate
        run: cargo test -p kordi-desktop --no-default-features

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Block private data and user-derived captures
        shell: bash
        env:
          KORDI_PRIVACY_DENYLIST: ${{ secrets.KORDI_PRIVACY_DENYLIST }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            comparison="${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            comparison="${{ github.event.before }}...${{ github.sha }}"
          else
            comparison="HEAD"
          fi
          node scripts/repository-privacy-guard.mjs --comparison "$comparison"

      - name: Check whitespace in changed files
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            bash scripts/check-hygiene.sh "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            bash scripts/check-hygiene.sh "${{ github.event.before }}...${{ github.sha }}"
          else
            bash scripts/check-hygiene.sh HEAD
          fi

      - name: Prevent quality debt growth
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            comparison="${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            comparison="${{ github.event.before }}...${{ github.sha }}"
          else
            comparison="HEAD"
          fi
          node scripts/report-maintainability-audit.mjs --limit 20
          node scripts/check-maintainability-ratchet.mjs "$comparison"
          node scripts/check-eslint-suppressions-ratchet.mjs "$comparison"

      - name: Verify the private denylist policy ran
        shell: bash
        env:
          KORDI_PRIVACY_DENYLIST: ${{ secrets.KORDI_PRIVACY_DENYLIST }}
        run: |
          set -euo pipefail
          if [ -z "${KORDI_PRIVACY_DENYLIST:-}" ]; then
            echo "::error::The private privacy denylist is unavailable for this event. Fork pull requests do not receive repository secrets, so the secret-free baseline ran but the complete privacy baseline did not. A reviewed fork policy is required before this check can pass."
            exit 1
          fi
