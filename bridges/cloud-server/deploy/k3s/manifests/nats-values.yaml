# Helm values for the official nats/nats chart.
#
# Single-replica NATS server with JetStream backed by a 10Gi local-path PVC.
# Cluster mode is off (would require >=2 replicas; HA is a later session).
# Deployed into the kordi-cloud namespace alongside Postgres + cloud-server,
# reachable as nats://nats.kordi-cloud.svc.cluster.local:4222.

config:
  # No clustering yet — keeps the install minimal for a single-node k3s.
  cluster:
    enabled: false

  jetstream:
    enabled: true
    fileStore:
      enabled: true
      dir: /data
      pvc:
        enabled: true
        size: 10Gi
        storageClassName: local-path

# The chart creates a ClusterIP Service on 4222 (clients) + 8222 (monitoring)
# by default; that's exactly what we want.
container:
  image:
    pullPolicy: IfNotPresent
  merge:
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
