# Postgres StatefulSet + headless Service for the Kordi cloud server.
#
# Single replica running on the k3s local-path StorageClass — fine for the
# single-node cluster on takotako; switch to a managed Postgres operator
# (CloudNativePG) when we add HA / replication.
#
# Credentials live in a separate Secret named `postgres-credentials` with
# key `password`. Apply that out of band (see deploy/k3s/README.md). The
# StatefulSet will not start without it.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: kordi-cloud
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: kordi
            - name: POSTGRES_DB
              value: kordi_cloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: PGDATA
              # Subdirectory under the mount so the lost+found dir on the
              # filesystem doesn't trip the postgres bootstrap check.
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kordi", "-d", "kordi_cloud"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "kordi", "-d", "kordi_cloud"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kordi-cloud
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: postgres
  # Headless service so the StatefulSet pod gets the stable DNS name
  # postgres-0.postgres.kordi-cloud.svc.cluster.local.
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
