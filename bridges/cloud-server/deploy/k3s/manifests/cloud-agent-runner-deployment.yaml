# Skeleton Cloud Agent Runner deployment for the kordi-cloud namespace.
#
# This service polls kordi-cloud-server for queued fallback runs. It uses the
# same runner-token Secret as the server-side runner endpoints. In this slice it
# executes the lifecycle skeleton only; sandbox/model/tool execution lands in
# follow-up #494 slices.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kordi-cloud-agent-runner
  namespace: kordi-cloud
  labels:
    app.kubernetes.io/name: kordi-cloud-agent-runner
    app.kubernetes.io/component: agent-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kordi-cloud-agent-runner
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kordi-cloud-agent-runner
        app.kubernetes.io/component: agent-runner
    spec:
      containers:
        - name: runner
          image: kordi-cloud-agent-runner:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: KORDI_CLOUD_API_BASE
              value: "http://kordi-cloud-server.kordi-cloud.svc.cluster.local:17081"
            - name: KORDI_CLOUD_RUNNER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KORDI_CLOUD_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kordi-cloud-runner
                  key: runner-token
            - name: KORDI_CLOUD_RUNNER_POLL_MS
              value: "2000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
