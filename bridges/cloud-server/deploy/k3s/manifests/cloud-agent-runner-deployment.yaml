apiVersion: v1
kind: ServiceAccount
metadata:
  name: kordi-cloud-agent-runner
  namespace: kordi-cloud
  labels:
    app.kubernetes.io/name: kordi-cloud-agent-runner
    app.kubernetes.io/component: agent-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kordi-cloud-agent-runner
  namespace: kordi-cloud
  labels:
    app.kubernetes.io/name: kordi-cloud-agent-runner
    app.kubernetes.io/component: agent-runner
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kordi-cloud-agent-runner
  namespace: kordi-cloud
  labels:
    app.kubernetes.io/name: kordi-cloud-agent-runner
    app.kubernetes.io/component: agent-runner
subjects:
  - kind: ServiceAccount
    name: kordi-cloud-agent-runner
    namespace: kordi-cloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kordi-cloud-agent-runner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kordi-cloud-agent-runner
  namespace: kordi-cloud
  labels:
    app.kubernetes.io/name: kordi-cloud-agent-runner
    app.kubernetes.io/component: agent-runner
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kordi-cloud-agent-runner
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kordi-cloud-agent-runner
        app.kubernetes.io/component: agent-runner
    spec:
      serviceAccountName: kordi-cloud-agent-runner
      containers:
        - name: runner
          image: kordi-cloud-agent-runner:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: KORDI_CLOUD_API_BASE
              value: "http://kordi-cloud-server.kordi-cloud.svc.cluster.local:17081"
            - name: KORDI_CLOUD_RUNNER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KORDI_CLOUD_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kordi-cloud-runner
                  key: runner-token
            - name: KORDI_CLOUD_RUNNER_POLL_MS
              value: "2000"
            - name: KORDI_CLOUD_SANDBOX_BACKEND
              value: "k8s"
            - name: KORDI_CLOUD_SANDBOX_NAMESPACE
              value: "kordi-cloud"
            - name: KORDI_CLOUD_SANDBOX_IMAGE
              value: "alpine:3.20"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
