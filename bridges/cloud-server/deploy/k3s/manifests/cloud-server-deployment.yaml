# Deployment for kordi-cloud-server in the kordi-cloud namespace.
#
# Reads DATABASE_URL from the postgres-credentials Secret. The Secret was
# created in session 3 with key 'password'; we wire the full connection
# string here using a non-secret hostname + a secret password.

apiVersion: v1
kind: Service
metadata:
  name: kordi-cloud-server
  namespace: kordi-cloud
spec:
  selector:
    app.kubernetes.io/name: kordi-cloud-server
  ports:
    - name: http
      port: 17081
      targetPort: http
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kordi-cloud-server
  namespace: kordi-cloud
  labels:
    app.kubernetes.io/name: kordi-cloud-server
    app.kubernetes.io/component: api
spec:
  # Bumped to 2 for session 6 — cross-replica rate limiter requires
  # multiple pods to be a meaningful test. Drop back to 1 if you want
  # single-replica behaviour while keeping the manifest layout.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kordi-cloud-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kordi-cloud-server
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: server
          image: kordi-cloud-server:dev
          # The local containerd image gets imported via
          #   sudo k3s ctr images import kordi-cloud-server.tar
          # so we never reach out to a registry.
          imagePullPolicy: IfNotPresent
          args:
            - "serve"
            - "--port"
            - "17081"
          ports:
            - name: http
              containerPort: 17081
              protocol: TCP
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: DATABASE_URL
              # We assemble the URL inline rather than storing the full
              # string in a Secret so the hostname can change with the
              # cluster Service without rotating secrets.
              value: "postgresql://kordi:$(PG_PASSWORD)@postgres.kordi-cloud.svc.cluster.local:5432/kordi_cloud"
            - name: NATS_URL
              # In-cluster NATS reachable via the headless Service. When
              # NATS is unavailable the bus fails open (no-op publishes),
              # so this is best-effort wiring, not a hard dependency.
              value: "nats://nats.kordi-cloud.svc.cluster.local:4222"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            - name: REDIS_URL
              # Cross-replica rate-limit counters. The cluster Service
              # 'redis' is headless; the per-pod stable name resolves
              # via cluster DNS so two cloud-server pods see the same
              # backend. Redis password is interpolated via $().
              value: "redis://default:$(REDIS_PASSWORD)@redis.kordi-cloud.svc.cluster.local:6379/0"
            - name: S3_ENDPOINT
              # MinIO inside the cluster. The signed URLs hand this
              # host back to clients verbatim, so external clients
              # need an externally-routable endpoint instead — set
              # S3_ENDPOINT to that public URL once a public ingress
              # for the bucket is in place.
              value: "http://minio.kordi-cloud.svc.cluster.local:9000"
            - name: S3_BUCKET
              value: "kordi-attachments"
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secret-key
            - name: KORDI_OAUTH_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: kordi-cloud-oauth
                  key: KORDI_OAUTH_GITHUB_CLIENT_ID
            - name: KORDI_OAUTH_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kordi-cloud-oauth
                  key: KORDI_OAUTH_GITHUB_CLIENT_SECRET
            - name: KORDI_OAUTH_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: kordi-cloud-oauth
                  key: KORDI_OAUTH_GOOGLE_CLIENT_ID
            - name: KORDI_OAUTH_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kordi-cloud-oauth
                  key: KORDI_OAUTH_GOOGLE_CLIENT_SECRET
            - name: KORDI_CLOUD_PUBLIC_BASE_URL
              value: "https://coordinar.io"
            - name: KORDI_CLOUD_OAUTH_REDIRECT_ALLOWLIST
              value: "http://127.0.0.1:,http://localhost:,https://coordinar.io"
            - name: KORDI_CLOUD_PROVIDER_AUTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: kordi-cloud-provider-auth
                  key: encryption-key
                  optional: true
            - name: KORDI_CLOUD_PROVIDER_AUTH_ENCRYPTION_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: kordi-cloud-provider-auth
                  key: encryption-key-id
                  optional: true
            - name: KORDI_CLOUD_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kordi-cloud-runner
                  key: runner-token
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
